[package]
name = "frankensearch-ops"
version = "0.2.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Operations control-plane TUI for frankensearch fleet monitoring"

[[bin]]
name = "frankensearch-ops"
path = "src/main.rs"

[features]
# Exposes internal pure functions (e.g. the RFC3339 fast path) for A/B microbenches.
bench-internals = []

[[bench]]
name = "percentile_select"
harness = false

[[bench]]
name = "rfc3339_parse_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "fleet_project_values_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "correlation_group_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "host_bucket_borrow_ab"
harness = false

[[bench]]
name = "sparkline_build_ab"
harness = false

[[bench]]
name = "fleet_rollup_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "event_bounds_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "rolling_counter_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "project_resolve_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "instance_map_hash_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "sort_choice_ab"
harness = false

[[bench]]
name = "filtered_ids_hash_ab"
harness = false

[dependencies]
frankensearch-core = { workspace = true }
frankensearch-tui = { workspace = true }
# FrankenSQLite 0.2.1 made every `Connection` method `async fn`, so the ops
# telemetry store drives the `async-api` facade (`AsyncConnection`) and threads
# a FrankenSQLite `Cx` for cancellation. `async-api` is not a default feature.
fsqlite = { version = "0.2.1", features = ["async-api"] }
fsqlite-types = "0.2.1"

# Runtime for the async telemetry store. Every `AsyncConnection` call requires
# a live asupersync runtime on the calling thread (`Runtime::current_handle`),
# so the ops binary owns one. The workspace and patched FrankenSQLite 0.2.1
# revision both resolve the same Asupersync 0.4.3 runtime.
asupersync = { workspace = true }

# Terminal UI rendering (FrankenTUI)
ftui-core = { workspace = true }
ftui-render = { workspace = true }
ftui-style = { workspace = true }
ftui-text = { workspace = true }
ftui-layout = { workspace = true }
ftui-widgets = { workspace = true }
ftui-tty = { workspace = true }
ftui-backend = { workspace = true }

# Fast (AES-NI) hasher for the hot per-event instance-id lookup maps
ahash = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Structured logging
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = "0.3"

[lints]
workspace = true
