[package]
name = "frankensearch-storage"
version = "0.2.1"
description = "FrankenSQLite-backed metadata and embedding job storage for frankensearch"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
frankensearch-core = { workspace = true }
asupersync = { workspace = true }
fsqlite = { version = "0.3.8", default-features = false, features = ["native", "async-api", "fts5"] }
fsqlite-types = { version = "0.3.8", features = ["native"] }
fsqlite-ext-fts5 = { version = "0.3.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[features]
fts5 = ["dep:fsqlite-ext-fts5"]
# Shared null-control bench harness (frankensearch_core::bench_support). Never a shipping profile.
bench-internals = ["frankensearch-core/bench-internals"]

[dev-dependencies]
# test-internals: asupersync::test_utils for #[cfg(test)] (workspace dep is default-features=false)
asupersync = { workspace = true, features = ["test-internals"] }
criterion = { workspace = true }
tempfile = "3.25"
tracing-subscriber = "0.3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[[bench]]
name = "dedup_batch"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "content_hash_dual"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "truncate_preview_ab"
harness = false
required-features = ["bench-internals"]

[lints]
workspace = true
