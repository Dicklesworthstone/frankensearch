[package]
name = "frankensearch-fusion"
version = "0.2.1"
description = "RRF fusion, score blending, and two-tier progressive search for frankensearch"
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = []
tantivy-bench = ["dep:frankensearch-lexical"]
quill = ["dep:frankensearch-quill"]
rerank = ["dep:frankensearch-rerank"]
graph = []
# Exposes bench-only twins of private code paths (e.g. `GraphRanker::rank_phase1_flat`) and the
# `bench_support` paired/null-control sampler, so an A/B can vary ONE thing inside the shipped
# function instead of comparing bench-local copies. Never enabled by a shipping profile; see
# bd-i40y / the 2026-07-10 ledger-integrity audit. Deliberately does NOT imply `graph`: the
# smoothing/hubness benches need the sampler but not the graph-ranking module. Pulls in core's
# `bench_support` (the shared paired sampler + null control), re-exported from `crate::bench_support`.
bench-internals = ["frankensearch-core/bench-internals"]

[dependencies]
frankensearch-core = { workspace = true }
frankensearch-embed = { workspace = true }
frankensearch-index = { workspace = true }
frankensearch-lexical = { workspace = true, optional = true }
frankensearch-quill = { workspace = true, optional = true }
frankensearch-rerank = { workspace = true, optional = true }
asupersync = { workspace = true }
ahash = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
# test-internals: asupersync::test_utils for #[cfg(test)] (workspace dep is default-features=false)
asupersync = { workspace = true, features = ["test-internals"] }
# hubness_dot_ab: A/B the private `dot` against the shipped AVX2 kernel + a rayon outer loop.
frankensearch-index = { workspace = true }
rayon = { workspace = true }
# compact_str: SSO-string clone-cost probe for the limit_all doc_id materialization
# lever (dev-only; already a transitive workspace dep). See doc_id_clone_sso bench.
compact_str = "0.9"
tempfile = "3"
tracing-test = "0.2"
criterion = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }

