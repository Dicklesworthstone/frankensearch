[package]
name = "frankensearch-quill-gauntlet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
frankensearch-quill = { path = "../../frankensearch-quill" }
frankensearch-core = { path = "../../frankensearch-core" }
frankensearch-quill-gauntlet = { path = "..", features = ["fuzz-harness"] }
# Match the registry source selected by the gauntlet workspace dependency. A
# path copy here would make `Cx` a different Rust type from the one accepted by
# `scalar_g1a_fuzz_pair`, even when both packages report the same version.
asupersync = { version = "=0.4.4", default-features = false, features = ["proc-macros", "test-internals"] }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "codec_bytes"
path = "fuzz_targets/codec_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_query_tree"
path = "fuzz_targets/typed_query_tree.rs"
test = false
doc = false
bench = false

[workspace]
