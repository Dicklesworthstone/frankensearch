[package]
name = "frankensearch-quill-gauntlet"
version = "0.2.1"
description = "Dev-only conformance harness for the Quill lexical engine"
publish = false
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
tantivy-oracle = [
    "dep:frankensearch-lexical",
    "frankensearch-lexical/tantivy-oracle",
    "frankensearch-quill/bench-internals",
]
perf-harness = [
    "tantivy-oracle",
    "frankensearch-lexical/bench-internals",
    "frankensearch-quill/bench-internals",
]

[dependencies]
asupersync = { workspace = true }
frankensearch-core = { workspace = true }
frankensearch-quill = { workspace = true, features = ["conformance-internals"] }
frankensearch-lexical = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
xxhash-rust = { workspace = true }
rustix = { version = "1.1.4", features = ["fs"] }

[[bin]]
name = "quill-perf-ratchet"
path = "src/bin/quill_perf_ratchet.rs"

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
criterion = { workspace = true }
frankensearch-quill = { workspace = true, features = ["bench-internals"] }
jsonschema = { version = "0.46", default-features = false }
rayon = { workspace = true }
tempfile = "3.27"
tracing-subscriber = { workspace = true }

[[bench]]
name = "perf_matrix"
harness = false
required-features = ["perf-harness"]

[lints]
workspace = true
