[package]
name = "frankensearch-index"
version = "0.2.3"
description = "FSVI vector index, SIMD dot product, and top-k search for frankensearch"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
# Every retained Criterion bench is declared explicitly below. The top-k
# admission probe is instead a normal binary so Cargo does not link this
# package's unrelated dev-dependency graph before emitting evidence.
autobenches = false

[features]
default = []
ann = ["dep:hnsw_rs", "dep:serde_json"]
hnsw-patch-ab = ["ann", "dep:hnsw_rs_034"]
# Shared null-control bench harness (frankensearch_core::bench_support). Never a shipping profile.
bench-internals = ["frankensearch-core/bench-internals"]

[dependencies]
frankensearch-core = { workspace = true }
half = { workspace = true }
wide = { workspace = true }
bytemuck = "1"
memmap2 = { workspace = true }
crc32fast = { workspace = true }
rayon = { workspace = true }
ahash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tempfile = "3"
libc = "0.2"
same-file = "1.0.6"

# Optional ANN
hnsw_rs = { workspace = true, optional = true }
# Exact published baseline for malformed-graph regression fixtures and the
# same-ELF bd-u3wt A/B runner. Never enabled by shipping feature aggregates.
hnsw_rs_034 = { package = "hnsw_rs", version = "=0.3.4", optional = true }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
asupersync = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
# For the head-to-head baseline kernels inside benches/dot_product.rs.
half = { workspace = true }
wide = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

# SIMD dot-product hot-loop benchmarks (brute-force vector top-k inner loop).
[[bench]]
name = "columnar_scan_ab"
harness = false

[[bench]]
name = "ivf_crossover_ab"
harness = false

[[bench]]
name = "ivf_recall_ab"
harness = false

[[bench]]
name = "quantize_slab"
harness = false

[[bench]]
name = "winners_sort"
harness = false

[[bench]]
name = "dot_product"
harness = false

# Per-hit quality-rescore doc_id lookup hasher (SipHash vs ahash) — paired A/B.
[[bench]]
name = "quality_rescore_hasher_ab"
harness = false

# FSVI two-tier quality-rescore scorer: decode+f32dot vs fused byte dot — paired A/B.
[[bench]]
name = "quality_rescore_fused_dot_ab"
harness = false

# vector_at_f32 F16 decode: scalar half::to_f32 vs SIMD widen8_f16_bytes — paired A/B.
[[bench]]
name = "vector_decode_f16_ab"
harness = false

# InMemoryVectorIndex::vector_at_f32 f16 decode: scalar vs SIMD widen8_f16_slice — paired A/B.
[[bench]]
name = "inmem_vector_decode_f16_ab"
harness = false

# HNSW (ANN) vs flat brute-force vector search — lever validation (latency + recall).
[[bench]]
name = "hnsw_vs_flat"
harness = false

# int8 ADC two-pass vs flat exact — lever validation (recall + latency over mult).
[[bench]]
name = "int8_two_pass"
harness = false

# REAL-embedding (potion/model2vec) validation of int8/4-bit quant + rotation lever.
[[bench]]
name = "real_embed_quant"
harness = false

# REAL-embedding validation of the HNSW ANN recall-certificate arc (--features ann).
[[bench]]
name = "real_embed_ann"
harness = false

# FSVI (file-backed) int8 two-pass vs flat exact — standalone large-N vector search.
[[bin]]
name = "int8_vs_f16_fast_ab"
path = "benches/int8_vs_f16_fast_ab.rs"
test = false
bench = false
required-features = ["bench-internals"]

[[bin]]
name = "hnsw_patch_ab"
path = "src/bin/hnsw_patch_ab.rs"
test = true
bench = false
required-features = ["hnsw-patch-ab"]

[[bench]]
name = "fsvi_int8_two_pass"
harness = false

# FSVI 4-bit (16-level) two-pass vs flat exact + int8 — recall + latency.
[[bench]]
name = "fsvi_4bit_two_pass"
harness = false

[[bench]]
name = "filtered_gather"
harness = false

[[bench]]
name = "batched_query_scan"
harness = false

[[bench]]
name = "f16_dot_ilp"
harness = false

[[bench]]
name = "i8_dot_ilp"
harness = false

[[bench]]
name = "max_reduction"
harness = false
required-features = ["bench-internals"]

