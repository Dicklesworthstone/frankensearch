name: Quill structural evidence rehearsal

on:
  pull_request:
    paths:
      - ".bench-history/**"
      - ".github/workflows/quill-perf-ratchet.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/frankensearch-core/**"
      - "crates/frankensearch-lexical/**"
      - "crates/frankensearch-quill/**"
      - "crates/frankensearch-quill-gauntlet/**"
      - "docs/contracts/quill-machine-classes.json"
      - "docs/contracts/quill-hyperopt-campaign.md"
      - "docs/contracts/quill-perf-gates.*"
      - "scripts/perf-runner.sh"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  # `matrix` is unavailable at workflow scope. Referencing `matrix.gate` here
  # made GitHub reject the workflow before creating any jobs.
  group: quill-perf-ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ratchet:
    name: Rehearse ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: quill-perf-ratchet-${{ github.event_name }}-${{ github.ref }}-${{ matrix.gate }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(github.event_name == 'pull_request' && '["QG-2"]' || '["QG-1","QG-2","QG-3","QG-4","QG-5","QG-6","QG-7","QG-8","QG-9","QG-10"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify frozen machine-class registry pin
        shell: bash
        run: |
          set -euo pipefail
          source_file="crates/frankensearch-quill-gauntlet/src/machine_class_registry.rs"
          registry="docs/contracts/quill-machine-classes.json"
          spec_commit="$(
            sed -n 's/^pub const MACHINE_CLASS_REGISTRY_SPEC_COMMIT: &str = \"\\([0-9a-f]\\{40\\}\\)\";/\\1/p' \
              "${source_file}"
          )"
          expected_blob="$(
            sed -n 's/^pub const MACHINE_CLASS_REGISTRY_GIT_BLOB: &str = \"\\([0-9a-f]\\{40\\}\\)\";/\\1/p' \
              "${source_file}"
          )"
          expected_sha="$(
            sed -n '/^pub const MACHINE_CLASS_REGISTRY_SHA256: &str =$/{
              n
              s/^    \"\\([0-9a-f]\\{64\\}\\)\";/\\1/p
            }' "${source_file}"
          )"
          test -n "${spec_commit}"
          test -n "${expected_blob}"
          test -n "${expected_sha}"
          test "$(sha256sum "${registry}" | cut -d' ' -f1)" = "${expected_sha}"
          test "$(git hash-object "${registry}")" = "${expected_blob}"
          git cat-file -e "${spec_commit}^{commit}"
          test "$(
            git ls-tree "${spec_commit}" -- "${registry}" | awk '{print $3}'
          )" = "${expected_blob}"

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Prepare pinned path dependency
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"

          clone_at() {
            local url="$1"
            local destination="$2"
            local revision="$3"
            git clone --no-checkout "${url}" "${destination}"
            git -C "${destination}" fetch --depth 1 origin "${revision}"
            git -C "${destination}" checkout --detach FETCH_HEAD
          }

          clone_at \
            "https://github.com/Dicklesworthstone/fast_cmaes.git" \
            "${deps_dir}/fast_cmaes" \
            "3bf11b7601b54a08ffabb55821289ecb235a504d"

          find "${GITHUB_WORKSPACE}" -name Cargo.toml -exec \
            sed -i -e "s|/data/projects/|${deps_dir}/|g" {} +

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: quill-perf-ratchet-${{ matrix.gate }}
          cache-targets: true

      - name: Validate registered-host launcher syntax
        shell: bash
        run: bash -n scripts/perf-runner.sh

      - name: Verify typed profile, plan, and bootstrap contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --profile release-perf \
            -p frankensearch-quill-gauntlet \
            --lib \
            perf::tests::profile_plans_cover_the_complete_matrix_and_reject_plan_or_matrix_drift \
            -- --exact
          cargo test \
            --profile release-perf \
            -p frankensearch-quill-gauntlet \
            --lib \
            perf_ratchet::tests::every_current_schema_bootstrap_sentinel_is_committed_and_exact \
            -- --exact

      - name: Prove hosted rehearsal remains fail-closed
        id: ratchet
        shell: bash
        env:
          QG_GATE: ${{ matrix.gate }}
          # Hosted runners have no immutable registered hardware/profile
          # identity and therefore execute no performance cells. Replaying the
          # exact unmeasured sentinel as both baseline and candidate must remain
          # Block or Quarantine. Allow would be a fail-open defect.
          QG_MODE: regression-alarm
        run: |
          set -euo pipefail
          history=".bench-history/${QG_GATE}.v8.unmeasured.latest.json"

          args=(
            --manifest docs/contracts/quill-perf-gates.toml
            --baseline "${history}"
            --candidate "${history}"
            --output "ci_artifacts/quill-perf/${QG_GATE}.ratchet.json"
            --mode "${QG_MODE}"
          )

          set +e
          cargo run \
            --profile release-perf \
            -p frankensearch-quill-gauntlet \
            --bin quill-perf-ratchet \
            -- \
            "${args[@]}"
          status=$?
          set -e

          case "${status}" in
            0)
              echo "hosted structural rehearsal unexpectedly allowed an unmeasured sentinel" >&2
              exit 1
              ;;
            1)
              echo "decision=block" >> "${GITHUB_OUTPUT}"
              echo "::notice::${QG_GATE} unmeasured sentinel correctly blocked"
              ;;
            2)
              echo "decision=quarantine" >> "${GITHUB_OUTPUT}"
              echo "::notice::${QG_GATE} unmeasured sentinel correctly quarantined"
              ;;
            *)
              echo "ratchet invocation failed with status ${status}" >&2
              exit "${status}"
              ;;
          esac

      - name: Upload QG fail-closed rehearsal artifacts and decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quill-perf-${{ matrix.gate }}-${{ steps.ratchet.outputs.decision || 'error' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ci_artifacts/quill-perf/
            .bench-history/${{ matrix.gate }}.v8.unmeasured.latest.json
