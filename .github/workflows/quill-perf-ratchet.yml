name: Quill structural evidence rehearsal

on:
  pull_request:
    paths:
      - ".bench-history/**"
      - ".github/workflows/quill-perf-ratchet.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/frankensearch-core/**"
      - "crates/frankensearch-lexical/**"
      - "crates/frankensearch-quill/**"
      - "crates/frankensearch-quill-gauntlet/**"
      - "docs/contracts/quill-machine-classes.json"
      - "docs/contracts/quill-hyperopt-campaign.md"
      - "docs/contracts/quill-perf-gates.*"
      - "scripts/perf-runner.sh"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  # `matrix` is unavailable at workflow scope. Referencing `matrix.gate` here
  # made GitHub reject the workflow before creating any jobs.
  group: quill-perf-ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ratchet:
    name: Rehearse ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: quill-perf-ratchet-${{ github.event_name }}-${{ github.ref }}-${{ matrix.gate }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(github.event_name == 'pull_request' && '["QG-2"]' || '["QG-1","QG-2","QG-3","QG-4","QG-5","QG-6","QG-7","QG-8","QG-9","QG-10"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify frozen machine-class registry pin
        shell: bash
        run: |
          set -euo pipefail
          source_file="crates/frankensearch-quill-gauntlet/src/machine_class_registry.rs"
          registry="docs/contracts/quill-machine-classes.json"
          spec_commit="$(
            sed -n 's/^pub const MACHINE_CLASS_REGISTRY_SPEC_COMMIT: &str = \"\\([0-9a-f]\\{40\\}\\)\";/\\1/p' \
              "${source_file}"
          )"
          expected_blob="$(
            sed -n 's/^pub const MACHINE_CLASS_REGISTRY_GIT_BLOB: &str = \"\\([0-9a-f]\\{40\\}\\)\";/\\1/p' \
              "${source_file}"
          )"
          expected_sha="$(
            sed -n '/^pub const MACHINE_CLASS_REGISTRY_SHA256: &str =$/{
              n
              s/^    \"\\([0-9a-f]\\{64\\}\\)\";/\\1/p
            }' "${source_file}"
          )"
          test -n "${spec_commit}"
          test -n "${expected_blob}"
          test -n "${expected_sha}"
          test "$(sha256sum "${registry}" | cut -d' ' -f1)" = "${expected_sha}"
          test "$(git hash-object "${registry}")" = "${expected_blob}"
          git cat-file -e "${spec_commit}^{commit}"
          test "$(
            git ls-tree "${spec_commit}" -- "${registry}" | awk '{print $3}'
          )" = "${expected_blob}"

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Prepare pinned sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"

          clone_at() {
            local url="$1"
            local destination="$2"
            local revision="$3"
            git clone --no-checkout "${url}" "${destination}"
            git -C "${destination}" fetch --depth 1 origin "${revision}"
            git -C "${destination}" checkout --detach FETCH_HEAD
          }

          clone_at \
            "https://github.com/Dicklesworthstone/asupersync.git" \
            "${deps_dir}/asupersync" \
            "15e6b6920fa0ad3e6d843ea55186eed754389ad2"
          clone_at \
            "https://github.com/Dicklesworthstone/frankensqlite.git" \
            "${deps_dir}/frankensqlite" \
            "5c99eeb93d789c1309d5c46a540289369ff39535"
          clone_at \
            "https://github.com/Dicklesworthstone/fast_cmaes.git" \
            "${deps_dir}/fast_cmaes" \
            "17f633e2c24bdd0c358310949066e5922b9e17b5"

          find "${GITHUB_WORKSPACE}" -name Cargo.toml -exec \
            sed -i -e "s|/data/projects/|${deps_dir}/|g" {} +

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: quill-perf-ratchet-${{ matrix.gate }}
          cache-targets: true

      - name: Validate registered-host launcher syntax
        shell: bash
        run: bash -n scripts/perf-runner.sh

      - name: Measure candidate and same-revision rehearsal
        shell: bash
        env:
          QUILL_PERF_GATE: ${{ matrix.gate }}
          QUILL_PERF_BUILD_PROFILE: release-perf
          QUILL_PERF_GIT_REV: ${{ github.sha }}
          QUILL_PERF_RUNS: "10"
          QUILL_PERF_SCALE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
          QUILL_PERF_RUN_WINDOW: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gate }}
        run: |
          set -euo pipefail
          for pass in candidate rerun; do
            export QUILL_PERF_RUN_ID="${pass}"
            export QUILL_PERF_OUTPUT_DIR="${GITHUB_WORKSPACE}/ci_artifacts/quill-perf/${pass}"
            cargo bench \
              --profile release-perf \
              -p frankensearch-quill-gauntlet \
              --bench perf_matrix \
              --features perf-harness \
              -- \
              --noplot
          done

      - name: Evaluate structural reproduction diagnostic
        id: ratchet
        shell: bash
        env:
          QG_GATE: ${{ matrix.gate }}
          # Hosted runners are structural diagnostics only. Exact ephemeral host
          # identity and the unmeasured sentinel deliberately yield Quarantine.
          # Promotion is possible only on an eligible registered class through
          # the typed producer's complete lifecycle.
          QG_MODE: regression-alarm
        run: |
          set -euo pipefail
          history=".bench-history/${QG_GATE}.unmeasured.latest.json"

          args=(
            --manifest docs/contracts/quill-perf-gates.toml
            --baseline "${history}"
            --candidate "ci_artifacts/quill-perf/candidate/${QG_GATE}.json"
            --candidate-evidence "ci_artifacts/quill-perf/candidate/${QG_GATE}.evidence.json"
            --rerun "ci_artifacts/quill-perf/rerun/${QG_GATE}.json"
            --rerun-evidence "ci_artifacts/quill-perf/rerun/${QG_GATE}.evidence.json"
            --output "ci_artifacts/quill-perf/${QG_GATE}.ratchet.json"
            --mode "${QG_MODE}"
          )

          set +e
          cargo run \
            --profile release-perf \
            -p frankensearch-quill-gauntlet \
            --bin quill-perf-ratchet \
            -- \
            "${args[@]}"
          status=$?
          set -e

          case "${status}" in
            0)
              echo "decision=allow" >> "${GITHUB_OUTPUT}"
              ;;
            1)
              echo "decision=block" >> "${GITHUB_OUTPUT}"
              exit 1
              ;;
            2)
              echo "decision=quarantine" >> "${GITHUB_OUTPUT}"
              echo "::warning::${QG_GATE} evidence quarantined; inspect the ratchet artifact"
              ;;
            *)
              echo "ratchet invocation failed with status ${status}" >&2
              exit "${status}"
              ;;
          esac

      - name: Upload QG rehearsal measurements and decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quill-perf-${{ matrix.gate }}-${{ steps.ratchet.outputs.decision || 'error' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ci_artifacts/quill-perf/
            .bench-history/${{ matrix.gate }}.*.json
