name: Dependency Semantics Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dependency-semantics-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Dependency Semantics Lint
        run: scripts/check_dependency_semantics.sh --mode all
