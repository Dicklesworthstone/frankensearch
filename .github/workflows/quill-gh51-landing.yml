# The connector-created push did not start an Actions run. Keep this recipe
# manual-only: it must never become an unattended main writer.
# Reviewed patch source: commit 93593f615e4dab17080e4d9ef7ee5bfa669f4ce0,
# .github/workflows/quill-gh51-landing.yml, blob below. No external patch source.
name: Quill gh51 delta-preflight landing

on:
  workflow_dispatch:
    inputs:
      land:
        description: Commit the two Rust files directly to main after all checks pass
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: quill-gh51-landing
  cancel-in-progress: false

jobs:
  validate-and-land:
    if: github.repository == 'Dicklesworthstone/frankensearch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out current main without destructive cleanup
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          clean: false

      - name: Apply the immutable reviewed patch to exact source preimages
        shell: bash
        run: |
          set -euo pipefail
          keeper=crates/frankensearch-quill/src/keeper.rs
          test "$(git rev-parse "HEAD:$keeper")" = 19b4b3b6ae02001eabfa40e3221ffc76d3ad270f
          test "$(git rev-parse HEAD:crates/frankensearch-quill/tests/publication_validation.rs)" = e155661edd2466cc1224738ad7568ca41d99f998
          test "$(git rev-parse HEAD:rust-toolchain.toml)" = 45da545f8b47809154191d5c34e50da349c0ae9d
          test -z "$(git status --porcelain)"
          recipe_commit=93593f615e4dab17080e4d9ef7ee5bfa669f4ce0
          git fetch --no-tags --depth=1 origin "$recipe_commit"
          git show "$recipe_commit:.github/workflows/quill-gh51-landing.yml" > "$RUNNER_TEMP/gh51-reviewed-recipe.yml"
          test "$(git hash-object "$RUNNER_TEMP/gh51-reviewed-recipe.yml")" = 1c35e410529cbb64f6d1754311ad372fe235a1b7
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          recipe = (root / 'gh51-reviewed-recipe.yml').read_text()
          body = recipe.split("<<'PATCH'\n", 1)[1].split('          PATCH\n', 1)[0]
          lines = body.splitlines(keepends=True)
          if not lines or any(not line.startswith('          ') for line in lines):
              raise SystemExit('Invalid immutable patch framing')
          (root / 'gh51.patch').write_text(''.join(line[10:] for line in lines))
          PYTHON
          git apply --unidiff-zero --check "$RUNNER_TEMP/gh51.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/gh51.patch"
          git diff --check

      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy

      - name: Format only the two changed Rust files
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/frankensearch-quill/src/keeper.rs crates/frankensearch-quill/tests/publication_validation.rs
          rustfmt --edition 2024 --check crates/frankensearch-quill/src/keeper.rs crates/frankensearch-quill/tests/publication_validation.rs
          git diff --check

      - name: Strict Quill library and publication lint checks
        run: cargo clippy --locked -p frankensearch-quill --lib --test publication_validation --test cancellation_contract --features durability,conformance-internals -- -D warnings

      - name: Default-feature Quill library and publication tests
        run: cargo test --locked -p frankensearch-quill --lib --test publication_validation --test cancellation_contract

      - name: Durability and deterministic cancellation regression tests
        run: cargo test --locked -p frankensearch-quill --lib --test publication_validation --test cancellation_contract --features durability,conformance-internals

      - name: Commit only validated production changes directly to main
        if: inputs.land
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import subprocess
          expected = {
              'crates/frankensearch-quill/src/keeper.rs',
              'crates/frankensearch-quill/tests/publication_validation.rs',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Refusing unexpected changed paths: {sorted(actual)}')
          PYTHON
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/frankensearch-quill/src/keeper.rs crates/frankensearch-quill/tests/publication_validation.rs
          git commit -m 'perf(quill): preflight only changed manifest entries (#51)' -m 'Preflight only complete manifest bindings not admitted by the reconciled retained snapshot. Preserve full fresh-open verification, changed-tombstone admission, cancellation, claims, and fail-closed reconciliation. Add selector tests and require retained-file corruption to fail the post-promotion fresh open.' -m 'Validated with pinned Rust formatting, strict Quill Clippy, and library/publication/cancellation tests with default and durability/conformance features. No end-to-end speedup or issue closure is claimed.'
          # Reject concurrent main changes; never force or rebase an untested tree.
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
