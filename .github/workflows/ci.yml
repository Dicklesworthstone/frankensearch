name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "crates-v*"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  installer-platform:
    name: Installer platform proof (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_args: ""
            expected_profile: semantic-loaders
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cargo_args: ""
            expected_profile: semantic-loaders
          - os: macos-15
            target: aarch64-apple-darwin
            cargo_args: ""
            expected_profile: semantic-loaders
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cargo_args: "--no-default-features"
            expected_profile: explicit-lite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          asupersync_ref="15e6b6920fa0ad3e6d843ea55186eed754389ad2"
          frankensqlite_ref="5c99eeb93d789c1309d5c46a540289369ff39535"
          fast_cmaes_ref="9406d5ec9512767106c9639628e30902ef7eae32"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          clone_or_update "https://github.com/Dicklesworthstone/asupersync.git" "${deps_dir}/asupersync" "${asupersync_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/frankensqlite.git" "${deps_dir}/frankensqlite" "${frankensqlite_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          while IFS= read -r -d '' manifest; do
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sed -i '' -e "s|/data/projects/|${deps_dir}/|g" "$manifest"
            else
              sed -i -e "s|/data/projects/|${deps_dir}/|g" "$manifest"
            fi
          done < <(find "$GITHUB_WORKSPACE" -name Cargo.toml -print0)

      - name: Install jsonschema validator module
        # The standalone `jsonschema` CLI was removed in python-jsonschema 4.x;
        # the contract scripts fall back to the python3 module, which must exist.
        # Use a runner-temp venv because Homebrew Python enforces PEP 668 and
        # rejects even user-site installs on current macOS runner images.
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/fsfs-installer-platform"
          validator_venv="${RUNNER_TEMP}/fsfs-jsonschema-venv"
          mkdir -p "${proof_dir}"
          printf 'runner_os=%s\nrunner_arch=%s\n' "${RUNNER_OS}" "${RUNNER_ARCH}" \
            >"${proof_dir}/jsonschema-preflight.txt"
          python3 -m venv "${validator_venv}"
          "${validator_venv}/bin/python" -m pip install --upgrade pip jsonschema \
            2>&1 | tee "${proof_dir}/jsonschema-install.log"
          "${validator_venv}/bin/python" -c 'from importlib.metadata import version; print(version("jsonschema"))' \
            >"${proof_dir}/jsonschema-version.txt"
          printf '%s\n' "${validator_venv}/bin" >>"${GITHUB_PATH}"

      - name: Exercise installer with the platform system Bash
        env:
          FSFS_INSTALL_TEST_BASH: /bin/bash
          FSFS_INSTALL_EXPECTED_PROFILE: ${{ matrix.expected_profile }}
        run: |
          /bin/bash --version | head -n 1
          /bin/bash -n install.sh
          /bin/bash -n scripts/check_fsfs_packaging_release_install_contract.sh
          /bin/bash scripts/check_fsfs_packaging_release_install_contract.sh --mode installer

      - name: Build declared installer profile
        run: cargo build --locked --release -p frankensearch-fsfs ${{ matrix.cargo_args }}

      - name: Cache verified model inputs for native semantic proof
        if: matrix.expected_profile == 'semantic-loaders'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/frankensearch/models
          key: installer-platform-models-${{ runner.os }}-${{ runner.arch }}-v1-a28f4eeb-c9745ed1

      - name: Provision verified model inputs for native semantic proof
        if: matrix.expected_profile == 'semantic-loaders'
        shell: bash
        run: |
          set -euo pipefail
          scripts/rch-ensure-deps.sh --models-only
          scripts/rch-ensure-deps.sh --models-only --check

      - name: Install built binary through installer production primitive
        env:
          FSFS_INSTALL_CONTRACT_TEST: "1"
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/fsfs-installer-platform"
          bin_dir="${proof_dir}/bin"
          mkdir -p "${bin_dir}"
          /bin/bash install.sh install-built target/release/fsfs "${bin_dir}/fsfs"
          "${bin_dir}/fsfs" version >"${proof_dir}/version.log" 2>&1
          {
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'profile=%s\n' '${{ matrix.expected_profile }}'
            printf 'system_bash=%s\n' "$(/bin/bash --version | head -n 1)"
            printf 'revision=%s\n' "${GITHUB_SHA}"
          } >"${proof_dir}/receipt.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${bin_dir}/fsfs" >"${proof_dir}/binary.sha256"
          else
            shasum -a 256 "${bin_dir}/fsfs" >"${proof_dir}/binary.sha256"
          fi

      - name: Exercise real native semantic quickstart offline
        if: matrix.expected_profile == 'semantic-loaders'
        timeout-minutes: 30
        shell: bash
        env:
          FRANKENSEARCH_REQUIRE_SEMANTIC_E2E: "1"
          FSFS_E2E_BINARY: ${{ runner.temp }}/fsfs-installer-platform/bin/fsfs
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/fsfs-installer-platform"
          export FRANKENSEARCH_MODEL_DIR="${HOME}/.local/share/frankensearch/models"

          cargo test --locked -p frankensearch-fsfs --test default_build_quickstart \
            loader_only::default_build_indexes_and_returns_a_real_hybrid_result \
            -- --ignored --exact --nocapture \
            2>&1 | tee "${proof_dir}/semantic-e2e.log"

          {
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'runner_os=%s\n' "${RUNNER_OS}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
            printf 'revision=%s\n' "${GITHUB_SHA}"
            printf 'offline=true\n'
            uname -a
          } >"${proof_dir}/semantic-e2e.receipt"

          receipt_paths=(
            "${FRANKENSEARCH_MODEL_DIR}/potion-multilingual-128M/.verified"
            "${FRANKENSEARCH_MODEL_DIR}/all-MiniLM-L6-v2/.verified"
          )
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${receipt_paths[@]}" >"${proof_dir}/model-receipts.sha256"
          else
            shasum -a 256 "${receipt_paths[@]}" >"${proof_dir}/model-receipts.sha256"
          fi

      - name: Upload installer platform proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fsfs-installer-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fsfs-installer-platform/**
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          asupersync_ref="15e6b6920fa0ad3e6d843ea55186eed754389ad2"
          frankensqlite_ref="5c99eeb93d789c1309d5c46a540289369ff39535"
          fast_cmaes_ref="9406d5ec9512767106c9639628e30902ef7eae32"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          # Clone as siblings of the checkout (../asupersync relative path),
          # pinned to explicit commits for reproducible CI.
          clone_or_update "https://github.com/Dicklesworthstone/asupersync.git" "${deps_dir}/asupersync" "${asupersync_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/frankensqlite.git" "${deps_dir}/frankensqlite" "${frankensqlite_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          # Cargo.toml files reference /data/projects/<dep> (local dev path).
          # Rewrite those absolute paths to point at the sibling clones for CI.
          while IFS= read -r -d '' manifest; do
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sed -i '' -e "s|/data/projects/|${deps_dir}/|g" "$manifest"
            else
              sed -i -e "s|/data/projects/|${deps_dir}/|g" "$manifest"
            fi
          done < <(find "$GITHUB_WORKSPACE" -name Cargo.toml -print0)

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ matrix.os }}-nightly
          cache-targets: true

      - name: Resolve validation profile
        id: validation_profile
        shell: bash
        run: |
          set -euo pipefail
          profile="premerge"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            profile="nightly"
          fi
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "validation_profile=${profile}" >> "${GITHUB_ENV}"

      - name: Validate crates.io publication planner
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          scripts/check_crates_publish_contract.sh --mode self-test
          scripts/check_crates_publish_contract.sh \
            --mode audit \
            --scope workspace \
            --output "${RUNNER_TEMP}/frankensearch-crates-publish-plan.json"
          jq -e '
            .schema == "frankensearch-crates-publish-plan-v1"
            and .scope == "workspace"
            and ([.packages[].name] | index("frankensearch-quill")) != null
            and ([.packages[].name] | index("frankensearch-fusion")) != null
            and ([.packages[].name] | index("frankensearch")) != null
            and (
              ([.packages[].name] | index("frankensearch-quill"))
              < ([.packages[].name] | index("frankensearch-fusion"))
            )
            and (
              ([.packages[].name] | index("frankensearch-quill"))
              < ([.packages[].name] | index("frankensearch"))
            )
          ' "${RUNNER_TEMP}/frankensearch-crates-publish-plan.json"

      - name: Upload crates.io publication-plan receipt
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crates-publish-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frankensearch-crates-publish-plan.json
          if-no-files-found: error

      - name: Validate fsfs model feature and release contract
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/check_fsfs_packaging_release_install_contract.sh --mode model-features

      - name: cargo check (workspace model-free defaults)
        run: cargo check --workspace --all-targets

      - name: cargo check (fsfs explicit model-free lane)
        run: cargo check -p frankensearch-fsfs --no-default-features

      - name: Downstream path-dep consumer smoke (fresh resolution, bd-efe5y)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # A green in-repo build can ride a warm Cargo.lock; a downstream path-dep
          # consumer (e.g. hfdt) always re-resolves from the DECLARED ranges. bd-efe5y:
          # the wide floor said 1.1.1 while the code needed 1.6.0's `widening_mul` —
          # invisible in-repo, fatal for every consumer. This synthesizes the smallest
          # such consumer and checks it against a lockfile built from scratch, so a
          # declared-range/API drift fails HERE instead of in the consumer's tree.
          consumer_dir="${RUNNER_TEMP}/frankensearch-consumer-smoke"
          rm -rf "${consumer_dir}"
          mkdir -p "${consumer_dir}/src"
          cat > "${consumer_dir}/Cargo.toml" <<EOF
          [package]
          name = "frankensearch-consumer-smoke"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          frankensearch = { path = "${GITHUB_WORKSPACE}/frankensearch" }
          frankensearch-index = { path = "${GITHUB_WORKSPACE}/crates/frankensearch-index" }
          frankensearch-quill = { path = "${GITHUB_WORKSPACE}/crates/frankensearch-quill" }
          EOF
          printf 'fn main() {}\n' > "${consumer_dir}/src/main.rs"
          cd "${consumer_dir}"
          cargo generate-lockfile
          cargo check --locked

      - name: Cache verified bundled model inputs
        uses: actions/cache@v4
        with:
          path: ~/.local/share/frankensearch/models
          key: bundled-model-inputs-${{ runner.os }}-v1-a28f4eeb-c9745ed1

      - name: Provision verified bundled model inputs
        shell: bash
        run: |
          set -euo pipefail
          scripts/rch-ensure-deps.sh --models-only
          scripts/rch-ensure-deps.sh --models-only --check

      - name: Stock-default fsfs semantic quickstart proof
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        shell: bash
        env:
          FRANKENSEARCH_REQUIRE_SEMANTIC_E2E: "1"
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/fsfs-default-semantic-e2e"
          mkdir -p "${artifact_dir}"
          export FRANKENSEARCH_MODEL_DIR="${HOME}/.local/share/frankensearch/models"

          cargo test --locked -p frankensearch-fsfs --test default_build_quickstart \
            loader_only::default_build_without_models_fails_closed_with_actionable_guidance \
            -- --exact --nocapture 2>&1 | tee "${artifact_dir}/missing-corrupt.log"
          cargo test --locked -p frankensearch-fsfs --test default_build_quickstart \
            loader_only::default_build_indexes_and_returns_a_real_hybrid_result \
            -- --ignored --exact --nocapture 2>&1 | tee "${artifact_dir}/real-model.log"

          sha256sum "${artifact_dir}/missing-corrupt.log" "${artifact_dir}/real-model.log" \
            >"${artifact_dir}/SHA256SUMS"
          python3 - "${artifact_dir}/receipt.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          receipt = {
              "schema": "fsfs-default-semantic-e2e-v1",
              "revision": os.environ["GITHUB_SHA"],
              "profile": "stock-default-semantic-loaders",
              "model_root": os.environ["FRANKENSEARCH_MODEL_DIR"],
              "lanes": [
                  "missing-corrupt",
                  "real-model-semantic-only",
                  "real-model-hybrid",
              ],
              "status": "pass",
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload stock-default fsfs semantic quickstart proof
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fsfs-default-semantic-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fsfs-default-semantic-e2e/**
          if-no-files-found: error
          retention-days: 14

      - name: cargo check (fsfs explicit embedded-models lane)
        run: cargo check -p frankensearch-fsfs --no-default-features --features embedded-models

      - name: QG-10 facade lexical feature graph guard (bd-8nqz.4.2)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          default_tree="$(cargo tree -p frankensearch --edges normal --prefix none)"
          if grep -Eq '^frankensearch-(lexical|quill) v' <<< "${default_tree}"; then
            echo "Default facade graph unexpectedly contains a lexical engine:" >&2
            grep -E '^frankensearch-(lexical|quill) v' <<< "${default_tree}" >&2
            exit 1
          fi

          quill_semantic_tantivy_count="$(
            cargo tree -p frankensearch --no-default-features --features quill,semantic \
              --edges normal --prefix none | grep -c tantivy || true
          )"
          if [[ "${quill_semantic_tantivy_count}" != "0" ]]; then
            echo "QG-10 failure: Quill+semantic facade graph contains Tantivy:" >&2
            cargo tree -p frankensearch --no-default-features --features quill,semantic \
              --edges normal --prefix none | grep tantivy >&2 || true
            exit 1
          fi

          cargo check -p frankensearch --lib --no-default-features --features quill
          cargo check -p frankensearch --lib --no-default-features --features lexical-tantivy
          cargo check -p frankensearch --lib --no-default-features --features cass-compat
          cargo check -p frankensearch --all-targets --all-features
          cargo check -p frankensearch-fusion --all-targets --all-features
          # bd-jt7b2: frankensearch-quill-gauntlet's --all-features build was
          # DARK for 13 hours and 124 commits after the LexicalSearch trait
          # split (327d264a), because three of its arms compile only under
          # feature combinations nothing routinely builds. The guard above
          # covers the FACADE's feature singles and the facade does not depend
          # on this dev-only crate, so nothing could see the hole. This is the
          # same defect class as bd-b7pz, reopened in a crate the old guard
          # cannot reach — so the guard has to name the crate, not the facade.
          cargo check -p frankensearch-quill-gauntlet --all-targets --all-features

      - name: cargo clippy (cass-compat lane) (bd-6281c)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # The workspace clippy step below runs on default features, so nothing
          # ever linted the cass-compat lane and unused imports accumulated there
          # unseen (bd-6281c). `cargo check` above proves the lane compiles; only
          # clippy proves it is clean. Both invocations are needed: the --lib one
          # covers the lane exactly as CI checks it, and the hash,cass-compat one
          # matches the feature shape a real CASS consumer resolves and reaches
          # the lib test target, where two of the three inherited reds lived.
          cargo clippy -p frankensearch --lib --no-default-features --features cass-compat -- -D warnings
          cargo clippy -p frankensearch --no-default-features --features hash,cass-compat --all-targets -- -D warnings

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude optimize-params -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --workspace

      - name: Nightly Quill xlarge generator integrity
        if: matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        timeout-minutes: 30
        run: cargo test --profile release -p frankensearch-quill-gauntlet generator::tests::nightly_xlarge_stream_hash_integrity -- --ignored --exact --nocapture

      - name: Quill/lexical/fusion PR fast lane (bd-quill-e6.9, bd-quill-e7.4)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        env:
          GAUNTLET_SUBJECT_REVISION: ${{ github.sha }}
          GAUNTLET_SUBJECT_DIRTY: "false"
          GAUNTLET_ARTIFACT_ROOT: target/coverage/quill-gauntlet-pr
        run: cargo test -p frankensearch-quill-gauntlet --features tantivy-oracle runner::tests::live_ -- --nocapture

      - name: Quill E6.3 metamorphic PR lane (bd-quill-e6.3)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          GAUNTLET_ARTIFACT_ROOT: target/coverage/quill-metamorphic-pr
        run: cargo test -p frankensearch-quill-gauntlet --features perf-harness e63_ -- --test-threads=4

      # The three index-maintenance families do not match the `e63_` filter --
      # they live in `metamorphic_maintenance_laws::` and are named after the
      # law, not the prefix. Their registry descriptors declare `Applies`, so
      # they must actually execute in CI; without this step the lane above
      # would report a green E6.3 campaign while merge, reopen/recovery, and
      # tombstone/compaction never ran. Separate step because cargo takes ONE
      # positional filter.
      - name: Quill E6.3 index-maintenance families (bd-quill-e6.3)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        env:
          GAUNTLET_ARTIFACT_ROOT: target/coverage/quill-metamorphic-pr
        run: "cargo test -p frankensearch-quill-gauntlet --features perf-harness metamorphic_maintenance_laws:: -- --test-threads=4"

      # A violated law shrinks its failing seed to a bounded fixture and writes
      # a redacted replay artifact before it fails the lane
      # (bd-e63-metamorphic-replay-artifact-lane-6p3hh). A GREEN lane emits
      # nothing, which is why this is `ignore` rather than `error`: the PR
      # lanes' artifacts are failure evidence, not a per-run receipt.
      #
      # The path is workspace-relative and so is the artifact root, because
      # `resolve_artifact_root` resolves a relative GAUNTLET_ARTIFACT_ROOT
      # against the WORKSPACE rather than the package directory cargo makes a
      # test binary's CWD (bd-s5nmk). `artifact::tests` pins both halves: the
      # resolution, and that every configured root here has an upload glob.
      - name: Upload Quill E6.3 metamorphic replay artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quill-metamorphic-pr-${{ github.run_id }}
          path: target/coverage/quill-metamorphic-pr/**
          if-no-files-found: ignore
          retention-days: 14

      # The nightly half of the E6.3 acceptance's "PR and nightly campaigns".
      # It sweeps a wider, deterministically derived seed set than the fixed PR
      # matrix, so schedules the PR lanes never generate get executed against
      # real merges, reopens and compactions. `--ignored` keeps it out of the
      # ordinary suite, the same shape as the nightly xlarge generator lane.
      - name: Nightly Quill E6.3 metamorphic sweep (bd-e63-metamorphic-replay-artifact-lane-6p3hh)
        if: matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        timeout-minutes: 30
        env:
          GAUNTLET_ARTIFACT_ROOT: target/coverage/quill-metamorphic-nightly
          QUILL_E63_NIGHTLY_SEEDS: "16"
        run: "cargo test -p frankensearch-quill-gauntlet --features perf-harness --lib metamorphic_maintenance_laws::nightly_metamorphic_lane::nightly_metamorphic_maintenance_sweep -- --ignored --exact --nocapture"

      # `error` here, unlike the PR upload above, because a completed nightly
      # sweep ALWAYS writes its receipt -- including when it found violations,
      # since the receipt is written before the lane fails. No files therefore
      # means the sweep did not complete, which is exactly the silent-nightly
      # failure this receipt exists to make visible.
      - name: Upload Quill E6.3 nightly metamorphic evidence
        if: always() && matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quill-metamorphic-nightly-${{ github.run_id }}
          path: target/coverage/quill-metamorphic-nightly/**
          if-no-files-found: error
          retention-days: 14

      - name: Bind job-scoped Salej artifact lane
        id: salej_lane
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          EXPECTED_SALEJ_LANE_KEY: ${{ github.job }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SALEJ_LANE_KEY}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe Salej artifact lane key: ${EXPECTED_SALEJ_LANE_KEY}" >&2
            exit 1
          fi
          printf 'key=%s\n' "${EXPECTED_SALEJ_LANE_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Assert Salej artifact lane identity contract
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          source = pathlib.Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          dollar = "$"
          lane_expression = (
              dollar + "{{ github.job }}-"
              + dollar + "{{ runner.arch }}-"
              + dollar + "{{ github.run_id }}-"
              + dollar + "{{ github.run_attempt }}"
          )
          lane_output = "steps" + ".salej_lane.outputs.key"
          lane_reference = dollar + "{{ " + lane_output + " }}"

          def job_block(job: str) -> str:
              match = re.search(
                  rf"(?ms)^  {re.escape(job)}:\n(?P<body>.*?)(?=^  [A-Za-z0-9_-]+:\n|\Z)",
                  source,
              )
              if match is None:
                  raise SystemExit(f"salej.identity.missing_job: {job}")
              return match.group(0)

          for job in ("quality", "salej-conformance"):
              block = job_block(job)
              declaration = f"EXPECTED_SALEJ_LANE_KEY: {lane_expression}"
              if block.count(declaration) != 1:
                  raise SystemExit(
                      f"salej.identity.lane_declaration: {job} expected exactly one {declaration!r}"
                  )
              binding_id = "id" + ": salej_lane"
              if block.count(binding_id) != 1:
                  raise SystemExit(
                      f"salej.identity.lane_binding_step: {job} expected exactly one salej_lane id"
                  )
              binding_match = re.search(
                  r"(?m)^\s+- name: Bind job-scoped Salej artifact lane\n"
                  + rf"\s+{re.escape(binding_id)}\n"
                  r"\s+if: always\(\) && matrix\.os == 'ubuntu-latest'$",
                  block,
              )
              if binding_match is None:
                  raise SystemExit(
                      f"salej.identity.lane_binding_guard: {job} must bind under always() "
                      "on the Ubuntu publication lane"
                  )
              failure_upload_guard = (
                  "if" + ": always() && failure() && matrix.os == 'ubuntu-latest' "
                  f"&& {lane_output} != ''"
              )
              if block.count(failure_upload_guard) != 1:
                  raise SystemExit(
                      f"salej.identity.failure_upload_guard: {job} expected exactly one "
                      f"{failure_upload_guard!r}"
                  )
              required = (
                  f"GAUNTLET_UNION_HORIZON_ARTIFACT_ROOT: target/coverage/quill-gauntlet-salej/{lane_reference}",
                  f"GAUNTLET_UNION_HORIZON_RUN_ID: {lane_reference}",
                  f"name: quill-gauntlet-salej-diagnostic-{lane_reference}",
                  f"path: target/coverage/quill-gauntlet-salej/{lane_reference}/*.json",
                  f"name: quill-gauntlet-salej-attempt-{lane_reference}",
                  f"path: target/coverage/quill-gauntlet-salej/{lane_reference}/**",
              )
              for fragment in required:
                  if block.count(fragment) != 1:
                      raise SystemExit(
                          f"salej.identity.contract_fragment: {job} expected exactly one {fragment!r}"
                      )
              if block.count(lane_reference) != len(required):
                  raise SystemExit(
                      f"salej.identity.unreviewed_lane_reference: {job} found "
                      f"{block.count(lane_reference)}, expected {len(required)}"
                  )
              expected_output_references = len(required) + 1
              if block.count(lane_output) != expected_output_references:
                  raise SystemExit(
                      f"salej.identity.unreviewed_output_reference: {job} found "
                      f"{block.count(lane_output)}, expected {expected_output_references}"
                  )
              first_reference = block.find(lane_reference)
              if first_reference <= binding_match.start():
                  raise SystemExit(
                      f"salej.identity.reference_before_binding: {job} consumes the lane key "
                      "before its always()-guarded producer"
                  )

          quality_key = f"quality-X64-{dollar}{{{{ github.run_id }}}}-{dollar}{{{{ github.run_attempt }}}}"
          conformance_key = f"salej-conformance-X64-{dollar}{{{{ github.run_id }}}}-{dollar}{{{{ github.run_attempt }}}}"
          if quality_key == conformance_key:
              raise SystemExit("salej.identity.collision: distinct github.job values collapsed")
          print("salej.identity.job_scoped_artifacts: PASS")
          PY

      - name: Salej partial pruning-receipt cancellation PR gate
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: cargo test -p frankensearch-quill --features pruning-conformance --test cancellation_contract pruning_conformance_traced_public_search_discards_partial_receipt_and_replays_exactly -- --exact --nocapture

      - name: Salej pruning-trace lifecycle unit PR gate
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: cargo test -p frankensearch-quill --lib --features pruning-conformance pruning_conformance_ -- --nocapture --test-threads=1

      - name: Salej direct-term MaxScore UNION_HORIZON diagnostic PR gate
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        env:
          GAUNTLET_SUBJECT_REVISION: ${{ github.sha }}
          GAUNTLET_SUBJECT_DIRTY: "false"
          GAUNTLET_UNION_HORIZON_ARTIFACT_ROOT: target/coverage/quill-gauntlet-salej/${{ steps.salej_lane.outputs.key }}
          GAUNTLET_UNION_HORIZON_RUN_ID: ${{ steps.salej_lane.outputs.key }}
        run: cargo test -p frankensearch-quill-gauntlet --features tantivy-oracle,pruning-conformance runner::tests::salej_complete_union_horizon_diagnostic_bundle -- --ignored --exact --nocapture --test-threads=1

      - name: Upload Salej UNION_HORIZON diagnostic bundle
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quill-gauntlet-salej-diagnostic-${{ steps.salej_lane.outputs.key }}
          path: target/coverage/quill-gauntlet-salej/${{ steps.salej_lane.outputs.key }}/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload non-admissible Salej failure attempt
        if: always() && failure() && matrix.os == 'ubuntu-latest' && steps.salej_lane.outputs.key != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quill-gauntlet-salej-attempt-${{ steps.salej_lane.outputs.key }}
          path: target/coverage/quill-gauntlet-salej/${{ steps.salej_lane.outputs.key }}/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Quill oracle PR campaign artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: quill-gauntlet-pr-${{ github.run_id }}
          path: target/coverage/quill-gauntlet-pr/**
          if-no-files-found: error
          retention-days: 14

      - name: Nightly Quill E5.5 seeded mixed-state conformance
        if: matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        timeout-minutes: 30
        run: cargo test --profile release -p frankensearch-quill-gauntlet engine::tests::e55_seeded_mixed_residency_conformance_is_exact -- --ignored --exact

      # frankensearch-quill declares a deliberate feature-exclusivity invariant:
      # `profile-internals` is a diagnostic sidecar that must never be linked
      # into a `bench-internals` timing build, because profile instrumentation
      # corrupts the timings this repo treats as evidence. It is enforced by a
      # compile_error! in crates/frankensearch-quill/src/lib.rs. `--all-features`
      # unions both, so a workspace-wide --all-features build CANNOT compile by
      # design -- this lane failed before it ran a single test, and had done so
      # unnoticed long enough for a genuinely broken feature to hide behind the
      # noise (bd-rg18d). A feature graph with a declared exclusivity invariant
      # simply has no single all-features build.
      #
      # Quill is therefore deselected here. It is still COMPILED as a dependency,
      # with bench-internals, via frankensearch-quill-gauntlet, so no coverage is
      # lost from that direction. Quill's own feature matrix is covered instead
      # by the two explicit arms below, one per side of the exclusion. Do NOT
      # "fix" this lane by deleting the compile_error! or by unioning the pair.
      - name: Nightly full validation (all features except the quill exclusivity pair)
        if: matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        env:
          QUILL_E3_9_RANDOM_SEEDS: "32"
          QUILL_E6_5_RANDOM_SEEDS: "16"
        run: cargo test --workspace --all-features --exclude frankensearch-quill -- --nocapture

      # The two arms bd-57cyv deferred and bd-46mo7 gated. Between them every
      # quill feature is exercised while respecting the compile_error!
      # exclusion, which no single build can do. They were held out of CI only
      # while they were red -- adding a known-red gate is what let bd-rg18d hide
      # for four days -- and both went green when bd-qoswh landed the GC
      # first-unreachable receipt, which was their single remaining failure
      # (arm A 621 passed/0 failed, arm B 622 passed/0 failed, measured in this
      # exact command form). If either arm goes red, fix the crate: do not
      # weaken, merge, or delete an arm.
      - name: Nightly quill feature matrix, timing arm (bd-57cyv)
        if: matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        timeout-minutes: 45
        run: cargo test -p frankensearch-quill --features durability,bench-internals,conformance-internals,pruning-conformance,tantivy-oracle -- --nocapture

      - name: Nightly quill feature matrix, diagnostic arm (bd-57cyv)
        if: matrix.os == 'ubuntu-latest' && steps.validation_profile.outputs.profile == 'nightly'
        timeout-minutes: 45
        run: cargo test -p frankensearch-quill --features durability,profile-internals,conformance-internals,pruning-conformance,tantivy-oracle -- --nocapture

      - name: E2E contract smoke (fsfs)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p frankensearch-fsfs --features embedded-models --test cli_e2e_contract -- --nocapture

      - name: Telemetry adapter dry-run lane smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test_logs/telemetry_adapters
          mkdir -p test_logs/telemetry_adapters

          declare -a lanes=(
            "cass scripts/e2e/telemetry_adapter_cass.sh"
            "xf scripts/e2e/telemetry_adapter_xf.sh"
            "mcp_agent_mail_rust scripts/e2e/telemetry_adapter_agent_mail.sh"
          )

          for lane in "${lanes[@]}"; do
            host="${lane%% *}"
            script="${lane#* }"

            bash "${script}" --mode all --dry-run

            run_dir="$(ls -1dt "test_logs/telemetry_adapters/${host}-all-"* 2>/dev/null | head -n1 || true)"
            if [[ -z "${run_dir}" ]]; then
              echo "Missing telemetry adapter run directory for host=${host}" >&2
              exit 1
            fi

            for artifact in manifest.json summary.json summary.md structured_events.jsonl replay_command.txt terminal_transcript.txt; do
              if [[ ! -f "${run_dir}/${artifact}" ]]; then
                echo "Missing artifact ${artifact} for host=${host} run=${run_dir}" >&2
                exit 1
              fi
            done

            jq -e \
              --arg host "${host}" \
              '.schema == "telemetry-adapter-e2e-manifest-v1" and .v == 1 and .host == $host and .execution_mode == "dry" and .status == "ok"' \
              "${run_dir}/manifest.json" >/dev/null

            jq -e \
              --arg host "${host}" \
              '.host == $host and .execution_mode == "dry" and .status == "ok" and (.reason_code | length > 0)' \
              "${run_dir}/summary.json" >/dev/null

            jq -s -e '
              length >= 2 and
              all(.[]; .schema == "telemetry-adapter-e2e-event-v1") and
              any(.[]; .body.stage == "session.init" and .body.status == "ok") and
              any(.[]; .body.stage == "session.finalize" and .body.status == "ok")
            ' "${run_dir}/structured_events.jsonl" >/dev/null
          done

      - name: Install JSON schema validator
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade jsonschema

      - name: Validate unified e2e artifact schema fixtures
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          for fixture in schemas/fixtures/e2e-*.json; do
            python3 -m jsonschema --instance "${fixture}" schemas/e2e-artifact-v1.schema.json
          done

          for fixture in schemas/fixtures-invalid/e2e-*.json; do
            if python3 -m jsonschema --instance "${fixture}" schemas/e2e-artifact-v1.schema.json; then
              echo "unexpected schema pass: ${fixture}" >&2
              exit 1
            fi
          done

      - name: Emit machine-queryable e2e artifact index
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts

          cat > ci_artifacts/e2e_artifact_index.ndjson <<'EOF'
          {"suite":"core","schema":"e2e-manifest-v1","status":"adopted","source":"crates/frankensearch-core/src/e2e_artifact.rs","required_failure_artifacts":["artifacts_index.json","replay_command.txt"],"requires_terminal_transcript_on_failure":false}
          {"suite":"fsfs","schema":"e2e-manifest-v1","status":"in_progress","source":"crates/frankensearch-fsfs/src/cli_e2e.rs","required_failure_artifacts":["artifacts_index.json","replay_command.txt"],"requires_terminal_transcript_on_failure":false}
          {"suite":"ops","schema":"e2e-manifest-v1","status":"pending","source":"crates/frankensearch-ops","required_failure_artifacts":["artifacts_index.json","replay_command.txt","terminal_transcript.txt"],"requires_terminal_transcript_on_failure":true}
          EOF

          cat > ci_artifacts/e2e_retention_policy.json <<'EOF'
          {
            "schema": "e2e-artifact-retention-policy-v1",
            "index_file": "e2e_artifact_index.ndjson",
            "success_retention_days": 7,
            "failure_retention_days": 30
          }
          EOF

      - name: Emit quality gate matrix + rollout checklist artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts

          cat > ci_artifacts/quality_gate_matrix.json <<EOF
          {
            "schema": "quality-gate-matrix-v1",
            "validation_profile": "${validation_profile}",
            "suites": [
              {"id":"unit","required":true,"lane":"cargo test --workspace"},
              {"id":"integration","required":true,"lane":"cargo test --workspace"},
              {"id":"snapshot","required":true,"status":"pending","bead":"bd-2yu.8.3"},
              {"id":"e2e","required":true,"lane":"cargo test -p frankensearch-fsfs --test cli_e2e_contract -- --nocapture"},
              {"id":"telemetry_adapter_dry_run","required":true,"lane":"scripts/e2e/telemetry_adapter_{cass,xf,agent_mail}.sh --mode all --dry-run"},
              {"id":"perf_artifact_contract","required":true,"status":"provisional_artifact_only","bead":"bd-2yu.8.4","gate_active":false},
              {"id":"fault","required":true,"status":"pending","bead":"bd-2yu.8.4"},
              {"id":"soak","required":true,"status":"pending","bead":"bd-2yu.8.5"},
              {"id":"contract_schema","required":true,"lane":"python3 -m jsonschema --instance schemas/fixtures/e2e-*.json schemas/e2e-artifact-v1.schema.json"}
            ],
            "profiles": {
              "premerge": {
                "description": "Fast gate for PR/push",
                "required_lanes": ["cargo check","cargo clippy","cargo fmt --check","cargo test --workspace","fsfs_cli_e2e_contract","telemetry_adapter_dry_run","schema_validation"]
              },
              "nightly": {
                "description": "Full validation sweep",
                "required_lanes": ["premerge","cargo test --workspace --all-features --exclude frankensearch-quill -- --nocapture","cargo test -p frankensearch-quill --features durability,bench-internals,conformance-internals,pruning-conformance,tantivy-oracle -- --nocapture","cargo test -p frankensearch-quill --features durability,profile-internals,conformance-internals,pruning-conformance,tantivy-oracle -- --nocapture"]
              }
            }
          }
          EOF

          cat > ci_artifacts/rollout_host_checklist.json <<'EOF'
          {
            "schema": "host-rollout-checklist-v1",
            "hosts": [
              "coding_agent_session_search",
              "xf",
              "mcp_agent_mail_rust",
              "frankenterm"
            ],
            "phases": ["shadow","canary","default"],
            "post_rollout_health_checks": [
              "slo_error_budget_within_threshold",
              "latency_budget_within_threshold",
              "degraded_reason_code_rate_within_threshold",
              "deterministic_replay_passed"
            ],
            "rollback_triggers": [
              "fatal_incident_open",
              "contract_breaking_output_regression",
              "persistent_latency_or_error_budget_breach",
              "replay_reproducible_failure_unresolved"
            ]
          }
          EOF

      - name: Emit statistical perf gate policy + provisional result artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts

          cat > ci_artifacts/perf_regression_gate_policy.json <<'EOF'
          {
            "schema": "perf-regression-gate-policy-v1",
            "thresholds_pct": {
              "p50": 5,
              "p95": 8,
              "p99": 12,
              "memory_peak_mb": 10
            },
            "confidence_target_pct": 95,
            "min_run_count": 5,
            "max_flake_reruns": 2,
            "gate_active": false,
            "enforcement": "artifact_contract_only",
            "reason_codes": [
              "perf.gate.pass",
              "perf.gate.missing_inputs",
              "perf.gate.inconclusive_confidence",
              "perf.gate.flake_suspected",
              "perf.gate.regression_detected"
            ]
          }
          EOF

          baseline_file="ci_artifacts/perf_metrics_baseline.json"
          current_file="ci_artifacts/perf_metrics_current.json"
          if [[ -f "${baseline_file}" && -f "${current_file}" ]]; then
            cat > ci_artifacts/perf_regression_gate_result.json <<'EOF'
          {
            "schema": "perf-regression-gate-result-v1",
            "status": "no_decision_provisional",
            "reason_code": "perf.gate.inconclusive_confidence",
            "gate_active": false,
            "enforcement": "artifact_contract_only",
            "details": "baseline/current artifacts present but evaluation lane not yet fully wired in this workflow",
            "replay_command": "cargo test --workspace --all-features --exclude frankensearch-quill -- --nocapture"
          }
          EOF
          else
            cat > ci_artifacts/perf_regression_gate_result.json <<'EOF'
          {
            "schema": "perf-regression-gate-result-v1",
            "status": "no_decision_provisional",
            "reason_code": "perf.gate.missing_inputs",
            "gate_active": false,
            "enforcement": "artifact_contract_only",
            "details": "benchmark metric artifacts not yet present in ci_artifacts/",
            "replay_command": "cargo test --workspace --all-features --exclude frankensearch-quill -- --nocapture"
          }
          EOF
          fi

      - name: Validate CI artifact payloads
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          jq -e -s '
            length == 3 and
            (map(.suite) | sort == ["core","fsfs","ops"]) and
            all(.[]; .schema == "e2e-manifest-v1") and
            all(.[]; (.required_failure_artifacts | index("artifacts_index.json")) != null) and
            all(.[]; (.required_failure_artifacts | index("replay_command.txt")) != null)
          ' ci_artifacts/e2e_artifact_index.ndjson >/dev/null

          jq -e '
            .schema == "e2e-artifact-retention-policy-v1" and
            .index_file == "e2e_artifact_index.ndjson" and
            .success_retention_days >= 1 and
            .failure_retention_days >= .success_retention_days
          ' ci_artifacts/e2e_retention_policy.json >/dev/null

          jq -e '
            .schema == "quality-gate-matrix-v1" and
            (.validation_profile == "premerge" or .validation_profile == "nightly") and
            (.suites | length >= 8)
          ' ci_artifacts/quality_gate_matrix.json >/dev/null

          jq -e '
            .schema == "host-rollout-checklist-v1" and
            (.hosts | length == 4) and
            (.phases == ["shadow","canary","default"]) and
            (.post_rollout_health_checks | length >= 4) and
            (.rollback_triggers | length >= 4)
          ' ci_artifacts/rollout_host_checklist.json >/dev/null

          jq -e '
            .schema == "perf-regression-gate-policy-v1" and
            (.thresholds_pct.p50 >= 1) and
            (.thresholds_pct.p99 >= .thresholds_pct.p95) and
            (.confidence_target_pct >= 50) and
            (.min_run_count >= 3) and
            (.gate_active == false) and
            (.enforcement == "artifact_contract_only") and
            (.reason_codes | length >= 5)
          ' ci_artifacts/perf_regression_gate_policy.json >/dev/null

          jq -e '
            .schema == "perf-regression-gate-result-v1" and
            (.status == "no_decision_provisional") and
            (.reason_code | startswith("perf.gate.")) and
            (.gate_active == false) and
            (.enforcement == "artifact_contract_only") and
            (.replay_command | length > 0)
          ' ci_artifacts/perf_regression_gate_result.json >/dev/null

      - name: Upload e2e artifact index (success retention)
        if: matrix.os == 'ubuntu-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-contract-index-success-${{ github.run_id }}
          path: ci_artifacts/*
          retention-days: 7

      - name: Upload e2e artifact index (failure retention)
        if: matrix.os == 'ubuntu-latest' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-contract-index-failure-${{ github.run_id }}
          path: ci_artifacts/*
          retention-days: 30

      - name: Upload telemetry adapter dry-run artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-adapter-dry-run-${{ github.run_id }}
          path: test_logs/telemetry_adapters/*
          retention-days: 14

      - name: Publish replay/triage runbook links on failure
        if: failure() && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          RUNBOOK_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/e2e-artifact-contract.md#replay-and-triage-playbook
          OPS_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/ops-tui-ia.md#e2e-failure-triage-playbook-link
        run: |
          set -euo pipefail
          echo "::notice title=Replay/Triage Playbook::${RUNBOOK_URL}"
          {
            echo "### Failure replay and triage"
            echo ""
            echo "- Unified v1 bundle playbook: [Replay and Triage Playbook](${RUNBOOK_URL})"
            echo "- Operator docs entrypoint: [Ops TUI IA playbook link](${OPS_URL})"
            echo "- Replay source of truth: \`replay_command.txt\` from the failing artifact bundle."
