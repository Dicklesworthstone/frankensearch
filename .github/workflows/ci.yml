  quill-consumer-e2e:
    name: Quill consumer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          asupersync_ref="15e6b6920fa0ad3e6d843ea55186eed754389ad2"
          frankensqlite_ref="5c99eeb93d789c1309d5c46a540289369ff39535"
          fast_cmaes_ref="9406d5ec9512767106c9639628e30902ef7eae32"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          clone_or_update "https://github.com/Dicklesworthstone/asupersync.git" "${deps_dir}/asupersync" "${asupersync_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/frankensqlite.git" "${deps_dir}/frankensqlite" "${frankensqlite_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          find "$GITHUB_WORKSPACE" -name Cargo.toml -exec \
            sed -i.bak -e "s|/data/projects/|${deps_dir}/|g" {} +
          find "$GITHUB_WORKSPACE" -name '*.bak' -delete

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quill-consumer-e2e
          cache-targets: true

      - name: Run consumer sweep with structured logs
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="ci_artifacts/quill_consumer_e2e"
          mkdir -p "${artifact_dir}"
          results="${artifact_dir}/suite-results.jsonl"
          : >"${results}"

          run_test_suite() {
            local suite="$1"
            local fixture_ids="$2"
            shift 2
            local log="${artifact_dir}/${suite}.log"
            "$@" 2>&1 | tee "${log}"
            local summary
            summary="$(grep 'test result: ok\.' "${log}" | tail -1)"
            if [[ -z "${summary}" ]]; then
              echo "missing successful test summary for ${suite}" >&2
              return 1
            fi
            local passed failed ignored
            passed="$(sed -E 's/.* ([0-9]+) passed;.*/\1/' <<<"${summary}")"
            failed="$(sed -E 's/.* ([0-9]+) failed;.*/\1/' <<<"${summary}")"
            ignored="$(sed -E 's/.* ([0-9]+) ignored;.*/\1/' <<<"${summary}")"
            jq -cn \
              --arg suite "${suite}" \
              --arg fixtures "${fixture_ids}" \
              --arg summary "${summary}" \
              --arg log "${suite}.log" \
              --argjson passed "${passed}" \
              --argjson failed "${failed}" \
              --argjson ignored "${ignored}" \
              '{
                suite: $suite,
                fixture_ids: ($fixtures | split(",")),
                status: "pass",
                passed: $passed,
                failed: $failed,
                ignored: $ignored,
                summary: $summary,
                log: $log
              }' >>"${results}"
          }

          run_command() {
            local suite="$1"
            local fixture_ids="$2"
            shift 2
            local log="${artifact_dir}/${suite}.log"
            "$@" 2>&1 | tee "${log}"
            jq -cn \
              --arg suite "${suite}" \
              --arg fixtures "${fixture_ids}" \
              --arg log "${suite}.log" \
              '{
                suite: $suite,
                fixture_ids: ($fixtures | split(",")),
                status: "pass",
                passed: 1,
                failed: 0,
                ignored: 0,
                summary: "command completed successfully",
                log: $log
              }' >>"${results}"
          }

          run_test_suite \
            fsfs-lib \
            "lexical-pipeline,watch-mode,runtime-output" \
            cargo test -p frankensearch-fsfs --lib -- --nocapture
          run_test_suite \
            fsfs-cli-formats \
            "json,jsonl,toon,csv,stream" \
            cargo test -p frankensearch-fsfs --features embedded-models --test cli_command_tests -- --nocapture
          run_test_suite \
            fsfs-cli-e2e \
            "dual-mode,index-search-status" \
            cargo test -p frankensearch-fsfs --features embedded-models --test cli_e2e_contract -- --nocapture
          run_test_suite \
            fsfs-baseline-matrix \
            "quill-e7-lexical,drift-dashboard" \
            cargo test -p frankensearch-fsfs --test benchmark_baseline_matrix -- --nocapture
          run_test_suite \
            fsfs-pressure \
            "gradual-ramp,spike-recovery,hysteresis,soak-faults" \
            cargo test -p frankensearch-fsfs --test pressure_simulation_harness -- --nocapture
          run_test_suite \
            facade-quill-durability \
            "index-builder,fslx-protect-verify-repair" \
            cargo test -p frankensearch --lib --no-default-features --features quill,durability -- --nocapture
          run_test_suite \
            facade-integration \
            "cross-component,consumer-api" \
            cargo test -p frankensearch --test integration --no-default-features --features hash,quill,durability -- --nocapture
          run_test_suite \
            facade-docs \
            "crate-quickstart" \
            cargo test -p frankensearch --doc --no-default-features --features hash,quill,durability -- --nocapture
          run_command \
            facade-basic-search \
            "basic-search,quill-lexical" \
            cargo run -p frankensearch --example basic_search --no-default-features --features hash,quill

          jq -s \
            --arg revision "${GITHUB_SHA}" \
            '{
              schema: "quill-consumer-e2e-sweep-v1",
              revision: $revision,
              lexical_engine: "quill",
              status: (if all(.status == "pass") then "pass" else "fail" end),
              suite_count: length,
              total_passed: (map(.passed) | add),
              total_failed: (map(.failed) | add),
              total_ignored: (map(.ignored) | add),
              suites: .
            }' "${results}" >"${artifact_dir}/manifest.json"
          jq -e \
            '.status == "pass" and .suite_count == 9 and .total_failed == 0' \
            "${artifact_dir}/manifest.json" >/dev/null

      - name: Upload consumer sweep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quill-consumer-e2e-${{ github.run_id }}
          path: ci_artifacts/quill_consumer_e2e/*
          retention-days: 30

  release-build:
    name: Release build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    # NOTE: Full builds explicitly enable embedded-models / fastembed and require
    # verified model inputs plus ort/ONNX Runtime,
    # which only provides prebuilt binaries for aarch64-apple-darwin, x86_64-pc-windows-msvc,
    # and x86_64-unknown-linux-gnu. Linux musl and x86_64-apple-darwin are only available
    # as lite builds (--no-default-features) — see release-build-lite job below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          asupersync_ref="15e6b6920fa0ad3e6d843ea55186eed754389ad2"
          frankensqlite_ref="5c99eeb93d789c1309d5c46a540289369ff39535"
          fast_cmaes_ref="9406d5ec9512767106c9639628e30902ef7eae32"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          clone_or_update "https://github.com/Dicklesworthstone/asupersync.git" "${deps_dir}/asupersync" "${asupersync_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/frankensqlite.git" "${deps_dir}/frankensqlite" "${frankensqlite_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          find "$GITHUB_WORKSPACE" -name Cargo.toml -exec \
            sed -i.bak -e "s|/data/projects/|${deps_dir}/|g" {} +
          find "$GITHUB_WORKSPACE" -name '*.bak' -delete

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-nightly
          cache-targets: true

      - name: Cache verified bundled model inputs
        uses: actions/cache@v4
        with:
          path: ~/.local/share/frankensearch/models
          key: bundled-model-inputs-${{ runner.os }}-v1-a28f4eeb-c9745ed1

      - name: Provision verified bundled model inputs
        shell: bash
        run: |
          set -euo pipefail
          scripts/rch-ensure-deps.sh --models-only
          scripts/rch-ensure-deps.sh --models-only --check

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build fsfs release binary (embedded models)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p frankensearch-fsfs --release --target "${{ matrix.target }}" --no-default-features --features embedded-models

      - name: Package archive + checksum
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary_name="fsfs"
          archive_extension="tar.xz"
          if [[ "${TARGET_TRIPLE}" == *"windows"* ]]; then
            binary_name="fsfs.exe"
            archive_extension="zip"
          fi

          binary_path="target/${TARGET_TRIPLE}/release/${binary_name}"
          if [[ ! -f "${binary_path}" ]]; then
            echo "Expected binary not found: ${binary_path}" >&2
            exit 1
          fi

          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip "${binary_path}" || true
          elif command -v strip >/dev/null 2>&1; then
            strip "${binary_path}" || true
          fi

          version_bare="${TAG_NAME#v}"
          archive_base="fsfs-${version_bare}-${TARGET_TRIPLE}"
          mkdir -p dist
          cp "${binary_path}" "dist/${binary_name}"
          if [[ "${archive_extension}" == "zip" ]]; then
            if command -v zip >/dev/null 2>&1; then
              (cd dist && zip -q "${archive_base}.zip" "${binary_name}")
            elif command -v powershell.exe >/dev/null 2>&1; then
              powershell.exe -NoLogo -NoProfile -Command \
                "Compress-Archive -Path 'dist/${binary_name}' -DestinationPath 'dist/${archive_base}.zip' -Force"
            elif command -v pwsh >/dev/null 2>&1; then
              pwsh -NoLogo -NoProfile -Command \
                "Compress-Archive -Path 'dist/${binary_name}' -DestinationPath 'dist/${archive_base}.zip' -Force"
            else
              echo "Neither zip nor PowerShell compression tooling is available." >&2
              exit 1
            fi
          else
            tar -C dist -cJf "dist/${archive_base}.tar.xz" "${binary_name}"
          fi
          archive_path="dist/${archive_base}.${archive_extension}"
          installer_archive_path="dist/fsfs-${TARGET_TRIPLE}.${archive_extension}"
          cp "${archive_path}" "${installer_archive_path}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_path}" > "${archive_path}.sha256"
            sha256sum "${installer_archive_path}" > "${installer_archive_path}.sha256"
          else
            shasum -a 256 "${archive_path}" > "${archive_path}.sha256"
            shasum -a 256 "${installer_archive_path}" > "${installer_archive_path}.sha256"
          fi

          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rustc_version="$(rustc -V)"
          cat > "dist/${archive_base}.metadata.json" <<EOF
          {
            "tag": "${TAG_NAME}",
            "target": "${TARGET_TRIPLE}",
            "binary": "${binary_name}",
            "build_timestamp_utc": "${build_timestamp}",
            "rustc": "${rustc_version}",
            "profile": "embedded",
            "semantic_loaders": true,
            "embedded_models": true
          }
          EOF
          rm -f "dist/${binary_name}"

          # bd-0zrer: the packaging contract declares release.build.missing_target
          # as a Required Reason Code, but nothing emitted it — a target whose
          # archive, checksum, or metadata never materialized would fail with a
          # bare shell error carrying no contract-declared code. Assert this
          # target's three artifacts exist before the job reports success.
          for required in \
            "${archive_path}" \
            "${archive_path}.sha256" \
            "dist/${archive_base}.metadata.json" \
            "${installer_archive_path}" \
            "${installer_archive_path}.sha256"; do
            if [[ ! -f "${required}" ]]; then
              echo "release.build.missing_target: target=${TARGET_TRIPLE} missing=${required}" >&2
              exit 1
            fi
          done

      - name: Install cosign (optional signing)
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign release archive (optional)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for archive in dist/*.tar.xz dist/*.zip; do
            [[ -f "${archive}" ]] || continue
            cosign sign-blob --yes \
              --output-signature "${archive}.sig" \
              --output-certificate "${archive}.pem" \
              "${archive}" || true
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  release-build-lite:
    name: Release build lite (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build_tool: zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build_tool: zigbuild
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_tool: cargo
          - os: macos-15
