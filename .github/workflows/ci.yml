          }

          clone_or_update "https://github.com/Dicklesworthstone/asupersync.git" "${deps_dir}/asupersync" "${asupersync_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/frankensqlite.git" "${deps_dir}/frankensqlite" "${frankensqlite_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          find "$GITHUB_WORKSPACE" -name Cargo.toml -exec \
            sed -i.bak -e "s|/data/projects/|${deps_dir}/|g" {} +
          find "$GITHUB_WORKSPACE" -name '*.bak' -delete

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-lite-${{ matrix.target }}-nightly
          cache-targets: true

      - name: Setup Zig (Linux cross-musl builds)
        if: matrix.build_tool == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Install cargo-zigbuild (Linux cross-musl builds)
        if: matrix.build_tool == 'zigbuild'
        run: cargo install cargo-zigbuild --locked

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build fsfs-lite release binary (no embedded models)
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          extra_features=""
          if [[ "${target}" == *"-musl"* ]] || [[ "${{ matrix.build_tool }}" == "zigbuild" ]]; then
            extra_features="--features vendored-openssl"
          fi
          if [[ "${{ matrix.build_tool }}" == "zigbuild" ]]; then
            cargo zigbuild -p frankensearch-fsfs --release --target "${target}" --no-default-features ${extra_features}
          else
            cargo build -p frankensearch-fsfs --release --target "${target}" --no-default-features ${extra_features}
          fi

      - name: Package lite archive + checksum
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary_name="fsfs"
          archive_extension="tar.xz"

          binary_path="target/${TARGET_TRIPLE}/release/${binary_name}"
          if [[ ! -f "${binary_path}" ]]; then
            echo "Expected binary not found: ${binary_path}" >&2
            exit 1
          fi

          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip "${binary_path}" || true
          elif command -v strip >/dev/null 2>&1; then
            strip "${binary_path}" || true
          fi

          version_bare="${TAG_NAME#v}"
          archive_base="fsfs-lite-${version_bare}-${TARGET_TRIPLE}"
          mkdir -p dist
          cp "${binary_path}" "dist/${binary_name}"
          tar -C dist -cJf "dist/${archive_base}.tar.xz" "${binary_name}"
          archive_path="dist/${archive_base}.${archive_extension}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_path}" > "${archive_path}.sha256"
          else
            shasum -a 256 "${archive_path}" > "${archive_path}.sha256"
          fi

          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rustc_version="$(rustc -V)"
          cat > "dist/${archive_base}.metadata.json" <<EOF
          {
            "tag": "${TAG_NAME}",
            "target": "${TARGET_TRIPLE}",
            "binary": "${binary_name}",
            "build_timestamp_utc": "${build_timestamp}",
            "rustc": "${rustc_version}",
            "profile": "lite",
            "semantic_loaders": false,
            "embedded_models": false
          }
          EOF
          rm -f "dist/${binary_name}"

          # bd-0zrer: the packaging contract declares release.build.missing_target
          # as a Required Reason Code, but nothing emitted it — a target whose
          # archive, checksum, or metadata never materialized would fail with a
          # bare shell error carrying no contract-declared code. Assert this
          # target's three artifacts exist before the job reports success.
          for required in \
            "${archive_path}" \
            "${archive_path}.sha256" \
            "dist/${archive_base}.metadata.json"; do
            if [[ ! -f "${required}" ]]; then
              echo "release.build.missing_target: target=${TARGET_TRIPLE} missing=${required}" >&2
              exit 1
            fi
          done

      - name: Upload lite release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-lite-${{ matrix.target }}
          path: dist/*

  release-publish:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled()
      && needs.release-build.result == 'success'
      && needs.release-build-lite.result == 'success'
      && needs.fsfs-executable-quickstart.result == 'success'
    needs: [release-build, release-build-lite, fsfs-executable-quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Validate exact six-profile release inventory
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "${TAG_NAME}" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          version = tag.removeprefix("v")
          root = pathlib.Path("dist")
          expected = {
              ("embedded", "aarch64-apple-darwin"): ("tar.xz", "fsfs", True, True),
              ("embedded", "x86_64-pc-windows-msvc"): ("zip", "fsfs.exe", True, True),
              ("lite", "x86_64-unknown-linux-musl"): ("tar.xz", "fsfs", False, False),
              ("lite", "aarch64-unknown-linux-musl"): ("tar.xz", "fsfs", False, False),
              ("lite", "x86_64-apple-darwin"): ("tar.xz", "fsfs", False, False),
              ("lite", "aarch64-apple-darwin"): ("tar.xz", "fsfs", False, False),
          }
          metadata_files = sorted(root.rglob("fsfs*.metadata.json"))
          if len(metadata_files) != len(expected):
              raise SystemExit(
                  f"release.inventory.metadata_count: expected 6, found {len(metadata_files)}: {metadata_files}"
              )

          seen = set()
          expected_archives = set()
          for metadata_path in metadata_files:
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              key = (metadata.get("profile"), metadata.get("target"))
              if key not in expected or key in seen:
                  raise SystemExit(f"release.inventory.unexpected_or_duplicate_pair: {key}")
              seen.add(key)
              extension, binary, semantic_loaders, embedded_models = expected[key]
              prefix = "fsfs" if key[0] == "embedded" else "fsfs-lite"
              base = f"{prefix}-{version}-{key[1]}"
              expected_metadata_name = f"{base}.metadata.json"
              if metadata_path.name != expected_metadata_name:
                  raise SystemExit(
                      f"release.inventory.metadata_name: expected {expected_metadata_name}, found {metadata_path.name}"
                  )
              expected_fields = {
                  "tag": tag,
                  "target": key[1],
                  "binary": binary,
                  "profile": key[0],
                  "semantic_loaders": semantic_loaders,
                  "embedded_models": embedded_models,
              }
              for field, value in expected_fields.items():
                  if metadata.get(field) != value:
                      raise SystemExit(
                          f"release.inventory.metadata_field: {metadata_path} {field}={metadata.get(field)!r}, expected {value!r}"
                      )

              archive_path = metadata_path.with_name(f"{base}.{extension}")
              checksum_path = archive_path.with_name(f"{archive_path.name}.sha256")
              if not archive_path.is_file() or not checksum_path.is_file():
                  raise SystemExit(
                      f"release.inventory.missing_archive_pair: archive={archive_path} checksum={checksum_path}"
                  )
              checksum_text = checksum_path.read_text(encoding="utf-8").strip()
              checksum_match = re.match(r"^([0-9a-fA-F]{64})(?:\s|$)", checksum_text)
              if checksum_match is None:
                  raise SystemExit(f"release.inventory.malformed_checksum: {checksum_path}")
              actual_digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
              if checksum_match.group(1).lower() != actual_digest:
                  raise SystemExit(f"release.inventory.checksum_mismatch: {archive_path}")
              expected_archives.add(archive_path.resolve())

          if seen != set(expected):
              raise SystemExit(f"release.inventory.missing_pairs: {sorted(set(expected) - seen)}")
          versioned_archives = {
              path.resolve()
              for path in root.rglob("fsfs*")
              if path.is_file()
              and re.match(r"^fsfs(?:-lite)?-[0-9].*\.(?:tar\.xz|zip)$", path.name)
          }
          if versioned_archives != expected_archives:
              raise SystemExit(
                  "release.inventory.archive_set_mismatch: "
                  f"missing={sorted(expected_archives - versioned_archives)} "
                  f"unexpected={sorted(versioned_archives - expected_archives)}"
              )
          print("release.inventory.exact_six: PASS")
          PY

      - name: Publish release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*

      # bd-0zrer: release.publish.asset_upload_failed is a Required Reason Code
      # with no emitter — an upload failure surfaced only as the action's own
      # error. Report the contract code when the upload step fails, and keep the
      # job red.
      - name: Report release asset upload failure
        if: failure() && steps.publish_release.outcome == 'failure'
        shell: bash
        run: |
          echo "release.publish.asset_upload_failed: tag=${GITHUB_REF_NAME} assets=dist/**/*" >&2
          exit 1

  publish-crates:
    name: Publish crates.io packages
    if: startsWith(github.ref, 'refs/tags/crates-v') && vars.ENABLE_CRATES_PUBLISH == 'true' && github.repository_owner == 'Dicklesworthstone'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          asupersync_ref="15e6b6920fa0ad3e6d843ea55186eed754389ad2"
          frankensqlite_ref="5c99eeb93d789c1309d5c46a540289369ff39535"
          fast_cmaes_ref="9406d5ec9512767106c9639628e30902ef7eae32"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          clone_or_update "https://github.com/Dicklesworthstone/asupersync.git" "${deps_dir}/asupersync" "${asupersync_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/frankensqlite.git" "${deps_dir}/frankensqlite" "${frankensqlite_ref}"
          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          find "$GITHUB_WORKSPACE" -name Cargo.toml -exec \
            sed -i.bak -e "s|/data/projects/|${deps_dir}/|g" {} +
          find "$GITHUB_WORKSPACE" -name '*.bak' -delete

      - name: Resolve and authenticate publication plan
        id: publish_plan
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          plan_path="${RUNNER_TEMP}/frankensearch-crates-publish-plan.json"
          scripts/check_crates_publish_contract.sh \
            --mode gate \
            --scope workspace \
            --registry-census live \
            --release-tag "${TAG_NAME}" \
            --output "${plan_path}"

          sequence="$(jq -r '[.packages[] | select(.action == "publish") | .name] | join(" ")' "${plan_path}")"
          exact_existing="$(jq -r '[.packages[] | select(.action == "skip_exact_archive") | .name] | join(" ")' "${plan_path}")"
          echo "Publication sequence: ${sequence:-<nothing-new>}"
          echo "Exact-source versions already present: ${exact_existing:-<none>}"
          echo "sequence=${sequence}" >> "${GITHUB_OUTPUT}"
          echo "plan_path=${plan_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload authenticated publication-plan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crates-publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frankensearch-crates-publish-plan.json
          if-no-files-found: error

      - name: Publish crates in dependency order
        if: steps.publish_plan.outputs.sequence != ''
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PLAN_PATH: ${{ steps.publish_plan.outputs.plan_path }}
          PUBLISH_SEQUENCE: ${{ steps.publish_plan.outputs.sequence }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required when ENABLE_CRATES_PUBLISH=true" >&2
            exit 1
          fi

          for crate in ${PUBLISH_SEQUENCE}; do
            crate_version="$(
              jq -r --arg crate "${crate}" \
                '.packages[] | select(.name == $crate) | .version' \
                "${PLAN_PATH}"
            )"
            for attempt in 1 2 3 4 5; do
              set +e
              dry_run_output="$(cargo publish -p "${crate}" --locked --dry-run 2>&1)"
              dry_run_status=$?
              set -e
              echo "${dry_run_output}"
              if [[ "${dry_run_status}" -eq 0 ]]; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "Dry-run publish checks failed for ${crate} after ${attempt} attempts." >&2
                exit 1
              fi
              sleep 20
            done
            echo "Publishing ${crate} ${crate_version}"
            cargo publish \
              -p "${crate}" \
              --locked \
              --token "${CARGO_REGISTRY_TOKEN}"
            sleep 30
          done
