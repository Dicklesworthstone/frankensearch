name: Ledger Integrity Lint

# Refuses a NEW rejected-lever row that cannot distinguish the lever from the
# harness. A KEEP must carry an executing-binary SHA-256 and classify itself as
# SELF-SPEEDUP maintenance or a same-invocation comparison against the named
# actual legacy incumbent. See scripts/check_ledger_null_control.sh for the
# contract and docs/LEDGER_RESURRECTION.md for the audit that motivated it.
#
# Ledger integrity DECAYS: across the fleet, repos that audited once and
# institutionalized the check sit near 1.7% void, while repos that audited and
# stopped sit at 25-91%. This job is the difference.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ledger-integrity-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Need history so the PR base is available to diff against.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate newly added REJECT and KEEP rows
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Fall back to the previous commit when no usable base is supplied
          # (e.g. a first push), so the job checks something rather than
          # silently passing.
          if [[ -z "${BASE_REF}" || "${BASE_REF}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_REF="HEAD~1"
          fi
          echo "Gating ledger rows added since ${BASE_REF}"
          scripts/check_ledger_null_control.sh --since "${BASE_REF}"

      - name: Exercise fail-closed gate contract
        run: scripts/check_ledger_null_control.sh --selfcheck

      - name: Report mechanical historical backlog (never fails)
        if: always()
        run: scripts/check_ledger_null_control.sh --all
