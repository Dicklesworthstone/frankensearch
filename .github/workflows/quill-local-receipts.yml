# Exact, reviewed engine integration for CASS #501. Only an explicit marker in
# a main commit or a manual dispatch can request a landing. No PRs, force-pushes,
# registry overrides, external patch inputs, or unvalidated module-graph landing.
name: Quill local-receipt native admission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quill-local-receipts.yml'
      - 'patches/quill-local-receipts.patch'
      - 'crates/frankensearch-quill/src/read_open_receipts.rs'
      - 'crates/frankensearch-quill/src/read_open_receipts/**'
      - 'crates/frankensearch-quill/src/keeper/receipt_*.rs'
  workflow_dispatch:
    inputs:
      land:
        description: Commit the exact native integration to main after all gates pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quill-local-receipts
  cancel-in-progress: false

jobs:
  native:
    if: >-
      github.repository == 'Dicklesworthstone/frankensearch' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[gh501-native-land]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out the exact requested main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: false

      - name: Verify source preimages and apply the reviewed native integration
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          while read -r expected path; do
            test "$(git rev-parse "HEAD:$path")" = "$expected" || {
              echo "Source changed; refusing an unreviewed patch: $path" >&2
              exit 1
            }
          done <<'PREIMAGES'
          a87af32e8477d7a99be6051b4bf07837ddfe0acc crates/frankensearch-quill/Cargo.toml
          9ad68b5b42790e1e0ced8e9db26d454e0d6f61cd crates/frankensearch-quill/src/lib.rs
          d4b278028b74a87f2630a7d15dd311757a5ca794 crates/frankensearch-quill/src/config.rs
          55bc1333b1591e905d117b4f3b2c78211760d452 crates/frankensearch-quill/src/keeper.rs
          bce4edbe8cb349ac32a713de84bc4d9c89f3f370 crates/frankensearch-quill/src/index.rs
          45da545f8b47809154191d5c34e50da349c0ae9d rust-toolchain.toml
          PREIMAGES
          git apply --unidiff-zero --check patches/quill-local-receipts.patch
          git apply --unidiff-zero patches/quill-local-receipts.patch
          git diff --check

      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy

      - name: Format and check only this integration's Rust sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            crates/frankensearch-quill/src/lib.rs
            crates/frankensearch-quill/src/config.rs
            crates/frankensearch-quill/src/keeper.rs
            crates/frankensearch-quill/src/index.rs
            crates/frankensearch-quill/src/read_open_receipts.rs
            crates/frankensearch-quill/src/read_open_receipts/tests.rs
            crates/frankensearch-quill/src/keeper/receipt_admission.rs
            crates/frankensearch-quill/src/keeper/receipt_regressions.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          rustfmt --edition 2024 --config skip_children=true --check "${files[@]}"
          git diff --check

      - name: Strict native engine lint and maintenance integration checks
        run: cargo clippy --locked -p frankensearch-quill --lib --test publication_validation --test cancellation_contract --features durability,conformance-internals -- -D warnings

      - name: Default engine tests including actual prefix-hash counters
        run: cargo test --locked -p frankensearch-quill --lib --test publication_validation --test cancellation_contract

      - name: Durability and cancellation regressions
        run: cargo test --locked -p frankensearch-quill --lib --test publication_validation --test cancellation_contract --features durability,conformance-internals

      - name: Check workspace consumers of the extended public configuration
        run: cargo check --locked --workspace

      - name: Commit the validated integration directly to unchanged main
        if: >-
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, '[gh501-native-land]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.land)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import subprocess
          required = {
              'crates/frankensearch-quill/Cargo.toml',
              'crates/frankensearch-quill/src/lib.rs',
              'crates/frankensearch-quill/src/config.rs',
              'crates/frankensearch-quill/src/keeper.rs',
              'crates/frankensearch-quill/src/index.rs',
          }
          allowed = required | {
              'crates/frankensearch-quill/src/read_open_receipts.rs',
              'crates/frankensearch-quill/src/read_open_receipts/tests.rs',
              'crates/frankensearch-quill/src/keeper/receipt_admission.rs',
              'crates/frankensearch-quill/src/keeper/receipt_regressions.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True)
          if not required <= changed or not changed <= allowed or untracked.strip():
              raise SystemExit(f'Refusing unexpected integration changes: {sorted(changed)}; untracked={untracked!r}')
          PYTHON
          git diff --check
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/frankensearch-quill/Cargo.toml \
            crates/frankensearch-quill/src/lib.rs crates/frankensearch-quill/src/config.rs \
            crates/frankensearch-quill/src/keeper.rs crates/frankensearch-quill/src/index.rs \
            crates/frankensearch-quill/src/read_open_receipts.rs \
            crates/frankensearch-quill/src/read_open_receipts/tests.rs \
            crates/frankensearch-quill/src/keeper/receipt_admission.rs \
            crates/frankensearch-quill/src/keeper/receipt_regressions.rs
          git commit -m 'feat(quill): integrate explicit read-only local admission receipts' \
            -m 'Wire opt-in Keeper and QuillSearchIndex admission/refresh while keeping defaults and maintenance writers strict. Retain lazy section validation, same-descriptor identity checks through full snapshot admission, boot-time expiry, and safe fallback for unusable proof state.' \
            -m 'Validated with pinned Rust formatting, strict native Clippy and default/durability publication/cancellation tests. No fresh-process performance measurement, CASS release adoption or issue closure is claimed.'
          # A concurrent main update makes this ordinary push fail. Never force.
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
