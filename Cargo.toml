[workspace]
resolver = "3"
members = [
    "crates/frankensearch-core",
    "crates/frankensearch-embed",
    "crates/frankensearch-index",
    "crates/frankensearch-lexical",
    "crates/frankensearch-fusion",
    "crates/frankensearch-rerank",
    "crates/frankensearch-storage",
    "crates/frankensearch-durability",
    "crates/frankensearch-fsfs",
    "crates/frankensearch-tui",
    "crates/frankensearch-ops",
    "crates/frankensearch-quill",
    "crates/frankensearch-quill-gauntlet",
    "frankensearch",
    "tools/optimize_params",
]
default-members = [
    "crates/frankensearch-core",
    "crates/frankensearch-embed",
    "crates/frankensearch-index",
    "crates/frankensearch-lexical",
    "crates/frankensearch-fusion",
    "crates/frankensearch-rerank",
    "crates/frankensearch-storage",
    "crates/frankensearch-durability",
    "crates/frankensearch-fsfs",
    "crates/frankensearch-tui",
    "crates/frankensearch-ops",
    "crates/frankensearch-quill",
    "frankensearch",
]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankensearch"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates
frankensearch-core = { version = "0.2.2", path = "crates/frankensearch-core" }
frankensearch-embed = { version = "0.2.2", path = "crates/frankensearch-embed", default-features = false }
frankensearch-index = { version = "0.2.2", path = "crates/frankensearch-index" }
frankensearch-lexical = { version = "0.2.2", path = "crates/frankensearch-lexical" }
frankensearch-fusion = { version = "0.2.2", path = "crates/frankensearch-fusion" }
frankensearch-rerank = { version = "0.2.3", path = "crates/frankensearch-rerank" }
frankensearch-storage = { version = "0.2.1", path = "crates/frankensearch-storage" }
frankensearch-durability = { version = "0.2.1", path = "crates/frankensearch-durability", default-features = false }
frankensearch-fsfs = { version = "1.4.3", path = "crates/frankensearch-fsfs" }
frankensearch-tui = { version = "0.2.0", path = "crates/frankensearch-tui" }
frankensearch-ops = { version = "0.2.0", path = "crates/frankensearch-ops" }
frankensearch-quill = { version = "0.2.1", path = "crates/frankensearch-quill" }

# Async runtime (structured concurrency, NO tokio)
# `default-features = false` keeps asupersync's `test-internals` feature out
# of PRODUCTION builds: requesting it here leaked it into every downstream
# production graph via Cargo feature unification (HFDT dependency gate RED).
# Crates that need `asupersync::test_utils` for #[cfg(test)] code re-enable
# it through their [dev-dependencies] entry:
#   asupersync = { workspace = true, features = ["test-internals"] }
# Same fix shape as frankensqlite (#104).
# Keep this pin aligned with HFDT and FrankenSQLite so downstream workspaces
# resolve a single Asupersync runtime universe. The 0.4.4 floor carries the
# native-task abort contract (acknowledged Cancelled is preserved) plus the
# HTTP/1 streaming cancel/reuse fixes; the <0.5 ceiling permits compatible
# 0.4.x source overrides without admitting a future semver-major API line.
# [bd-3h229]
asupersync = { version = ">=0.4.4, <0.5", default-features = false, features = ["proc-macros"] }
arc-swap = "=1.9.2"

# Descriptor-relative generation-root admission. Keep the syscall surface
# explicit so unsupported targets compile without pulling platform code in.
rustix = { version = "=1.1.4", default-features = false, features = [
    "std",
    "fs",
    "process",
    "thread",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-rust = "0.1.3"

# Error handling
thiserror = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Data parallelism (CPU-bound vector ops, NOT an async runtime)
rayon = "1.10"

# Compact strings and POD casts used by Quill's ingest/SIMD paths.
compact_str = "0.10"
bytemuck = "1"

# SIMD and f16 quantization (unconditional for frankensearch-index)
half = "2.4"
# Floor 1.6.0 is load-bearing: simd.rs/in_memory.rs call `widening_mul`, which only
# exists in wide >= 1.6.0 (1.5.0 has only the pre-rename `mul_widen`). A lower floor
# lets a consumer's stale lockfile resolve 1.1.1-1.5.0 and fail mid-compile (bd-efe5y).
wide = "1.6.0"

# Memory-mapped I/O
memmap2 = "0.9"

# Embedder dependencies (feature-gated per crate)
# Default features pull in native-tls and network stacks that transitively
# depend on forbidden Tokio ecosystem crates. Keep only ORT's rustls-backed
# binary acquisition path; model provisioning is owned by frankensearch.
fastembed = { version = "=6.0.0", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
] }
safetensors = "0.8.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
# frankentorch (pure-Rust tensor lib) backing the frankensearch-rerank `native`
# feature (cross-encoder reranker + MiniLM embedder). The family is published
# on crates.io under `frankentorch-*` names (`ft-api` on crates.io belongs to
# an unrelated crate, so the git-era `ft-*` names stay as workspace dep keys
# via `package =` renames). For local frankentorch development, add a
# `[patch.crates-io]` block pointing frankentorch-api / frankentorch-autograd /
# frankentorch-core at ../frankentorch/crates/* locally (do NOT commit it).
ft-api = { package = "frankentorch-api", version = "0.1.0" }
ft-autograd = { package = "frankentorch-autograd", version = "0.1.0" }
ft-core = { package = "frankentorch-core", version = "0.1.0" }

# Full-text search
# Registry 0.26.1 pins lru ^0.16.3, which RUSTSEC-2026-0253 marks unsound
# (patched only in lru >= 0.18.2, unreachable from ^0.16.3). The advisory is
# informational: the use-after-free needs `catch_unwind` around a panicking
# `Drop` on a cache KEY type, and tantivy's lru caches are keyed by integers
# and other trivially-droppable types, so the pattern cannot occur in this
# graph. A registry pin is required for crates.io publication (a git dep is
# unpublishable); move to tantivy 0.27 when it ships with patched lru.
tantivy = "=0.26.1"

ndarray = "0.17"

# HNSW approximate nearest neighbors. Published fork of upstream hnsw_rs 0.3.4
# (crates.io `hnsw_rs` belongs to upstream): carries layer-invariant and
# hnswio-hardening fixes; the upstream import path is kept via `package =`.
hnsw_rs = { package = "frankenhnsw", version = "=0.3.5", default-features = false }

# CRC32 checksums for FSVI index integrity
crc32fast = "1"

# Fast non-cryptographic hashing for hot-path HashMaps (inspired by fff.nvim)
ahash = "0.8"

# Stable durable hashing (xxh3); never substitute process-seeded ahash here.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Unicode normalization
unicode-normalization = "0.1"

# Platform-standard directories for model storage

# TOML parsing for configuration surfaces
toml = "1.0.3"

# SHA-256 verification for model manifests
sha2 = "0.11.0"

# Authenticated encryption and keyed digests for private evidence artifacts (bd-fttb)
chacha20poly1305 = "=0.11.0"
getrandom = "=0.4.3"
hmac = "=0.13.0"
zeroize = "=1.9.0"

# PDF text extraction (digital PDFs with selectable text)
pdf-extract = "0.12.0"

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.6"

# Date/time formatting/parsing for telemetry RFC3339 timestamps

# System information (CPU, memory, etc.)
sysinfo = "0.39.6"

# FrankenTUI terminal UI framework
ftui-core = "0.5.0"
ftui-render = "0.5.0"
ftui-style = "0.5.0"
ftui-text = "0.5.0"
ftui-layout = "0.5.1"
ftui-widgets = "0.5.0"
ftui-tty = "0.5.0"
ftui-backend = "0.5.0"
ftui-extras = "0.5.0"

# FrankenSQLite production edge is crates.io 0.3.8 (async Connection plus
# the AsyncConnection sync facade). Do not reintroduce a 0.1 compatibility
# line here: it would split the Asupersync runtime universe again.

[workspace.lints.rust]
# `deny` instead of `forbid` so crates that need unsafe (e.g. mmap) can opt in.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# ── Nightly-unstable pedantic/nursery lints that churn CI ──
# Nightly clippy adds new collapsible_if/match patterns (let-chains) that churn CI.
collapsible_if = "allow"
collapsible_match = "allow"
# Nightly const-eval expansion causes false positives on match-based fns.
missing_const_for_fn = "allow"
# Function length is a design judgement; enforcing in CI is too noisy.
too_many_lines = "allow"
# 8-arg async fns with &self are common in download/retry helpers.
too_many_arguments = "allow"
# clone-then-into inside branches that return early is a valid pattern.
redundant_clone = "allow"
# Intentional same-arm matches improve readability of exhaustive handling.
match_same_arms = "allow"
# Missing # Panics for infallible unwraps on static patterns is noise.
missing_panics_doc = "allow"
# Use-after-import ordering in test modules and conditional blocks is fine.
items_after_statements = "allow"
# map().unwrap_or() is often clearer than map_or() for multi-line closures.
map_unwrap_or = "allow"
# Inlined format args style is a preference, not a correctness issue.
uninlined_format_args = "allow"
# Closure-based map/filter chains are idiomatic Rust.
redundant_closure_for_method_calls = "allow"
# Casting usize to f32/f64 in test helpers and metrics is intentional.
cast_precision_loss = "allow"
# Single-pattern match can be clearer than if-let for complex destructuring.
single_match_else = "allow"
# Prefixed bindings like `let _guard = ...` are idiomatic for RAII.
no_effect_underscore_binding = "allow"
# HashMap generalization over hashers is premature in application code.
implicit_hasher = "allow"
# `if !x { ... } else { ... }` is sometimes clearer than inverting branches.
if_not_else = "allow"
# `.is_multiple_of()` is nightly-only and not yet stable.
manual_is_multiple_of = "allow"
# `Duration::from_secs(120)` is clearer than `from_mins(2)` for timeouts.
duration_suboptimal_units = "allow"
# async fns without await are fine as trait implementations / future-proofing.
unused_async = "allow"
# Separate multiply-then-add is intentional; fused mul_add changes semantics slightly.
suboptimal_flops = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-perf]
inherits = "release"
# The normative QG manifest specifies thin LTO. Inheriting release's fat LTO
# made cold bench-only links exceed the admission window before either the
# executable hash or A/A control could run (bd-l5x3, bd-3srq).
lto = "thin"
debug = "line-tables-only"
strip = false

# Real-model E2E lanes run MiniLM/tokenizer inference inside `cargo test`; at
# the default opt-level=0 a single corpus embedding takes minutes and the
# resulting timings violate the "optimized inference" evidence criterion
# (bd-tqhy). Dependencies get optimized; first-party test code stays at
# opt-level 0 for debuggability.
[profile.test.package."*"]
opt-level = 2
