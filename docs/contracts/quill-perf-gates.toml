# Quill performance gate manifests (QG-1..QG-10) — bd-quill-e0-contracts-j53p.6
# Normative companion: docs/contracts/quill-perf-gates.md (laws, activation rules, layout).
# A gate is PROVISIONAL until `activated = true`, which requires every pin below to be real
# (fixtures committed, oracle config verified identical, stat rule wired into the harness).
# Consumed by the gauntlet crate's bench harness (crates/frankensearch-quill-gauntlet) by path.

[defaults]
oracle = "tantivy 0.26.1 via frankensearch-lexical (feature tantivy-oracle)"
oracle_config = "identical analyzer semantics; identical heap budget; commits inside the same versioned operation scope for BOTH engines; symmetric setup/teardown and warmup outside decision samples; same-binary paired blocks with stable IDs and deterministic seeded balanced-random order; Tantivy/Tantivy A/A plus Quill/Quill A/A and candidate A/B in the same QG-1 invocation"
build_profile = "release-perf equivalent: opt-level=3, lto=thin, codegen-units=1, force-frame-pointers=yes"
stat_rule = "quill-paired-estimator-v1; >=10 complete blocks; primary effect is the robust center of paired log(treatment/control) with deterministic seeded paired-bootstrap 95% CI (2000 resamples); persist both-arm absolutes and a diagnostic ratio-of-arm-medians; A/A must pass predeclared center, CI-width, log-dispersion, order-balance, order-effect and drift limits; structural mismatch fails closed; invalid null or contradictory summaries emit NoDecision; NEVER gate on cv_pct"
operation_scope = "stable operation_id@positive-version plus metric semantics and unit; Criterion may coexist only under an explicitly different scope or when it consumes the exact same raw blocks"
raw_sample = "stable block/sample IDs; arm and execution order; warmup/measurement phase; monotonic start/end timestamps; matched docs/work and bytes denominators; executable/corpus/worker/profile provenance"
decision_precedence = "Fatal > Block > Quarantine > NoDecision/Provisional > Allow"
ratchet = ".bench-history/<gate>.<machine-class>.latest.json is one atomic pointer to immutable <date>.<run-id> threshold/evidence objects; pass-over-pass within thresholds; regressions replay via seeded harness"
machines = ["m4-macos (registered Apple Silicon hardware and diagnostic class; every gate promotion-unavailable pending supported actual-executing-image attestation)", "m5-macos (unavailable until a frozen fingerprint is admitted)", "trj-zen3-<1..64>c[-smt2] (registered Threadripper PRO 5995WX execution classes)", "x86-vps-ovh (diagnostic-only; never promotion-eligible)"]
machine_gate_availability = "m4-macos admits no promotion gate until a supported O_EXEC or loaded-image mechanism attests the actual executing image; all current M4 measurements are diagnostic-only; QG-3/4/5 are unavailable on every machine class until both arms emit a non-declarative witness of the required symmetric durability treatment"
normative_thread_budget = "the typed producer derives the exact maximum thread width from the selected gate's complete frozen matrix and requires the receipt thread budget and RAYON_NUM_THREADS to equal it; caller-selected or class-capacity defaults are rejected"
rss_probe = "linux: /proc/self/status VmHWM; macos: mach task_info / time -l (per-OS abstraction mandatory — e8.4 notes)"

[evidence]
# Decision-grade artifact layer above the paired estimator (bd-uh2f / bd-uh2f.1).
schema = "quill-perf-evidence-v3"
artifact = "<gate>.evidence.json sealed with an embedded SHA-256 over its own canonical JSON; <gate>.evidence.md derived from the persisted JSON string; atomic tmp+fsync+rename+dirsync writes; load verifies seal, recomputes every estimator and registry-bound runner identity from retained raw facts, and rejects truncated or stale-schema files; legacy v3 loads only via the explicit read-only path"
estimands = "metric-specific, enforced by gate: QG-1/2/3/4/5/8 flat paired log ratio; QG-6 hierarchical two-stage per-query resampling (queries first, then blocks; 4 pinned queries per class); QG-7 process RSS; QG-9 cold open requiring verified cache-state proof (currently NoDecision: in-process reopen does not drop the OS page cache); QG-10 dependency facts outside timing A/A (diagnostic)"
policy = "reconciliation dead band ln(1.005); absolute-vs-paired tolerance ln(1.25); >=2 hierarchical groups with >=2 pairs each; 1 warmup round outside every decision set; raw-sample cap 20000 per cell"
provenance = "benchmark ELF SHA-256; benchmark git revision + dirty-state hash; Cargo.lock SHA-256; exact NUL-separated and NUL-terminated process argv SHA-256; canonical cleared build-plus-workload environment SHA-256; typed-finalizer contract version + build-time full Git revision + build-time dirty posture + build-time Cargo.lock SHA-256 + independently hashed held finalizer executable; rustc/target/profile/features; producer OS; host identity; host-wide physical cores and logical threads; process-available concurrency; configured engine thread widths plus per-cell observed Quill/Tantivy concurrency for QG-1/QG-8; exact runtime-detected ISA joined to the registered class and receipt; effective affinity/cpuset cap; machine fingerprint + governor + load averages; peak RSS with method (unsupported reported as absent, never zero); corpus/query-set hashes + generator seed/revision; exact frozen registry identity; canonical class plus hardware/request/start/end facts; exact run-log/threshold/pre-binding-evidence manifest; strict v5 sealed post-exit runner-completion receipt bytes and SHA-256"
ratchet_seam = "the shell performs bounded argument/root-shape checks, opens the prebuilt typed finalizer on inherited descriptor 9, and executes that held descriptor; the typed producer opens the canonical shared-namespace host-global lease before Git inspection, hashing, run-directory creation, or local benchmark compilation; registered hosts provide one shared mount namespace and do not unlink/rename the lease inode during a campaign; compiler and benchmark children inherit the locked open-file description so producer death cannot orphan unleased load; under the lease the producer rejects redirecting Git and process-injection state, clears and rebuilds exact Cargo/measurement environments, persists and receipt-binds their canonical environment-policy.json preimage, rejects hidden index flags, dirty source, and noncanonical roots, pins output/target directory handles, verifies the held finalizer against its embedded build identity, creates the run root relative to the pinned parent, constrains the Cargo-reported benchmark beneath the pinned target, and hashes/executes its held descriptor; observed thermal/start facts must pass frozen-registry hardware/execution/durability preflight before the run log opens or the child spawns; a failed child emits only a sealed nonpromotable frankensearch.perf-runner-attempt.v1 diagnostic receipt; a successful run owns end probes, exact log/manifest, terminal receipt admission, and an in-memory bound preview, then writes diagnostic-only frankensearch.perf-run-precommit.v3 PRECOMMIT.json before the required strict v5 receipt last as the sole commit boundary; receipts retain the family-specific logical lease identity; a measured baseline resolves through one atomic latest pointer to its immutable already-bound threshold/evidence generation while candidate and rerun supply fresh pre-binding evidence, receipt, manifest, and actual log inputs and must carry byte-equal producer identities and benchmark executables; only the exact current-schema unmeasured sentinel may omit baseline evidence and any attempted sentinel identity is rejected as fabrication; invalid, stale, mixed, tampered, or unverified runs are never ratchet-admissible and perform zero history writes; an Allow decision durably records the complete publication plan before immutable <date>.<run-id> objects are written and the single latest pointer advances last; downstream validators consult ratchet_admissible() and record Allow/Block/Quarantine via apply_gate_decision (bd-quill-e8-perf-doctrine-x4e4.15.1)"

[corpus.tiny]
source = "fsfs benchmark_baseline_matrix golden profile 'tiny'"
[corpus.small]
source = "fsfs benchmark_baseline_matrix golden profile 'small'"
[corpus.medium]
source = "fsfs benchmark_baseline_matrix golden profile 'medium'"
[corpus.xlarge]
source = "synthetic 1M docs; Zipf terms s in {0.8,1.1,1.4}; code-file length distribution capped 2MiB; unicode mix lanes; generator = quill-e6.1 (content-addressed seed manifest embedded in artifacts)"
status = "LANDED deterministic content-addressed 1M-doc generator (quill-e6.1)"

[gate.QG-1]
name = "bulk indexing, multi-core"
fixture = "tiny + small + medium + xlarge; positions ON/OFF; threads = 1,2,4,8,16,32,64,96,128; commit included in timed window"
target = "docs_per_sec >= 3.0x oracle AND >= 0.60x measured tokenize-only bandwidth ceiling (honesty denominator lane: same corpus through the tokenizer alone)"
activated = false

[gate.QG-2]
name = "bulk indexing, single-thread"
fixture = "medium; positions ON; threads = 1; commit included"
target = "docs_per_sec >= 1.5x oracle"
activated = false

[gate.QG-3]
name = "watch-mode incremental"
fixture = "5k-update upsert-heavy batches over a warm medium corpus; measured in BOTH topologies (bd-quill-duel-visibility-contract): (a) in-process reader, (b) fresh-process reader"
target = "floor: >=20k docs/s initial, >=5k updates/s, p95 <= 25ms (lexical_pipeline.rs contract, both topologies where applicable); headroom: update->searchable >= 4x oracle commit+reload path — claim (a) IN-PROCESS ONLY, publish both numbers with topology labels"
activated = false

[gate.QG-4]
name = "commit latency"
fixture = "100k-doc index, warm; sealed-commit distribution over 100 commits"
target = "p99 <= 50ms sealed commit; visibility lead (in-process searchable-before-commit) demonstrated once delta (e5.x) lands — until then this clause is N/A (G1a has no delta)"
activated = false

[gate.QG-5]
name = "full compaction"
fixture = "1M docs (xlarge) at tombstone densities {5, 20, 50}% — NEVER 0% (bd-6m8p lesson)"
target = "wall-clock >= 5x faster than oracle force-merge at 20%; report all densities"
activated = false

[gate.QG-6]
name = "query latency"
fixture = "query-class mix from search_quality_harness slices (identifier/short_keyword/natural_language/phrase/boolean) x k in {10,100} x corpus {100k, 1M}"
target = "p50 parity (+-10%) per class; p99 <= oracle per class; NO class regresses >10%; fuel-metering checkpoints (bd-quill-duel-fuel-metering) must show no measurable delta here before merging"
activated = false

[gate.QG-7]
name = "memory"
fixture = "peak ingest RSS at equal budget config (medium, 8 threads); index bytes/doc on medium+xlarge"
target = "peak RSS <= oracle; bytes/doc <= 1.15x oracle (positions ON) and <= 0.8x (positions OFF vs oracle positions-on default); budget DECLARES the 8-bytes/doc IDMAP content_hash (registry 1.0.2) and tombstone/blockmax/idmap overheads itemized"
activated = false

[gate.QG-8]
name = "scaling curve (contention honesty)"
fixture = "bulk indexing threads {1,2,4,8,16,(32 where available)}; both reference machines; oracle curve measured alongside"
target = "16-thread >= 1.8x own 4-thread on x86 reference; any plateau ATTRIBUTED (allocator contention axis mandatory — e8.4 notes; a bandwidth ceiling is honest, a lock plateau is a bug). Apple Silicon QG-8 is unavailable until a class-specific matrix freezes meaningful 10P and 14P+E endpoints plus a real scheduler witness; no trimmed x86 matrix may activate an Apple claim"
activated = false

[gate.QG-9]
name = "cold open"
fixture = "1M-doc index (xlarge), cold page cache (documented eviction method per OS); default config (durable verify OFF)"
target = "open() <= 50ms (manifest + lazy sections) vs oracle reader open"
activated = false

[gate.QG-10]
name = "dependency surface"
fixture = "cargo tree -p frankensearch --features lexical, default features, post-flip"
target = "tantivy + its transitive tree ABSENT from default graph; delta recorded in the flip evidence bundle (quill-e7.6)"
activated = false
