# Quill performance gate manifests (QG-1..QG-10) — bd-quill-e0-contracts-j53p.6
# Normative companion: docs/contracts/quill-perf-gates.md (laws, activation rules, layout).
# A gate is PROVISIONAL until `activated = true`, which requires every pin below to be real
# (fixtures committed, oracle config verified identical, stat rule wired into the harness).
# Consumed by the gauntlet crate's bench harness (crates/frankensearch-quill-gauntlet) by path.

[defaults]
oracle = "tantivy 0.26.1 via frankensearch-lexical (feature tantivy-oracle)"
oracle_config = "identical analyzer semantics; identical heap budget; commits inside the same versioned operation scope for BOTH engines; symmetric setup/teardown and warmup outside decision samples; same-binary paired blocks with stable IDs and deterministic seeded balanced-random order; Tantivy/Tantivy A/A plus Quill/Quill A/A and candidate A/B in the same QG-1 invocation"
build_profile = "release-perf equivalent: opt-level=3, lto=thin, codegen-units=1, force-frame-pointers=yes"
stat_rule = "quill-paired-estimator-v1; >=10 complete blocks; primary effect is the robust center of paired log(treatment/control) with deterministic seeded paired-bootstrap 95% CI (2000 resamples); persist both-arm absolutes and a diagnostic ratio-of-arm-medians; A/A must pass predeclared center, CI-width, log-dispersion, order-balance, order-effect and drift limits; structural mismatch fails closed; invalid null or contradictory summaries emit NoDecision; NEVER gate on cv_pct"
operation_scope = "stable operation_id@positive-version plus metric semantics and unit; Criterion may coexist only under an explicitly different scope or when it consumes the exact same raw blocks"
raw_sample = "stable block/sample IDs; arm and execution order; warmup/measurement phase; monotonic start/end timestamps; matched docs/work and bytes denominators; executable/corpus/worker/profile provenance"
decision_precedence = "Fatal > Block > Quarantine > NoDecision/Provisional > Allow"
ratchet = ".bench-history/<gate>.<hardware-class>.<execution-profile>.latest.json is one frankensearch.perf-history-pointer.v2 atomic pointer to immutable profile-qualified <date>.<run-id> threshold/evidence objects; pass-over-pass comparisons, null bands, reruns, and destinations never cross the immutable hardware/profile key"
machines = ["trj-zen3-5995wx/physical-64 (registered, required; capacity 64 physical cores)", "trj-zen3-5995wx/smt2-128 (registered, required; capacity 128 logical threads)", "m4-macos/scheduler-10 (registered, required, promotion held pending supported actual-loaded-image attestation; capacity 10 scheduler workers)", "m5-macos/scheduler-14 (unavailable but required; capacity and maximum widths absent until a real fingerprint and scheduler receipt land)", "x86-vps-ovh/x86-diagnostic (registered diagnostic-only; never supplies default-flip authority)"]
machine_gate_availability = "M4 promotion is held on supported O_EXEC or loaded-image attestation; M5 is unavailable-required and must not be rewritten as all N/A; x86-vps-ovh/x86-diagnostic is diagnostic-only; QG-3/4/5 are promotion-unavailable on every profile until both arms emit a non-declarative witness of identical durability treatment"
profile_applicability = "the unchanged complete canonical gate matrix is projected through the frozen registry under frankensearch.quill-perf-applicability-plan.v2; the plan hash binds this independently normalized manifest SHA-256 and any gate.primary_target_cell_width; cells above the profile maximum are NotApplicable with typed hardware/profile/capacity/required-width/maximum facts, runnable diagnostic-profile or canonical-diagnostic cells are Diagnostic, and all other runnable cells are Required; a required profile must retain the primary target as Required; ratchet-admissible decision evidence must cover exactly Required plus Diagnostic with matching roles and must exclude NotApplicable; bounded partial runnable evidence is durable but non-adjudicable"
normative_execution_envelope = "capacity semantics, execution capacity, and per-gate maximum exercised width come only from the frozen registry and reconstructed applicability plan, never from a caller; RAYON_NUM_THREADS equals profile execution capacity while measured cells stop at the plan maximum"
registered_host_command = "scripts/perf-runner.sh --gate <QG-N> --hardware-class <hardware-class> --execution-profile <execution-profile> --run-id <unique-pass-id> --run-window <shared-window> [platform-required bounded options]"
cli_identity = "--hardware-class and --execution-profile are an inseparable immutable key; producer/launcher legacy --class, --thread-budget, and --apple-mode flags are rejected, and the ratchet rejects the former class-only --machine-class flag"
rss_probe = "linux: /proc/self/status VmHWM; macos: mach task_info / time -l (per-OS abstraction mandatory — e8.4 notes)"

[schemas]
threshold_artifact = "quill-perf-artifact-v7"
evidence_artifact = "quill-perf-evidence-v5"
evidence_assembly = "quill-perf-evidence-assembly-v2"
machine_registry = "frankensearch.quill-machine-class-registry.v2"
applicability_plan = "frankensearch.quill-perf-applicability-plan.v2"
runner_completion_receipt = "frankensearch.perf-runner-completion.v6"
runner_artifact_manifest = "frankensearch.perf-runner-artifact-manifest.v3"
local_producer_contract = "frankensearch.quill-local-perf-producer.v4"
history_pointer = "frankensearch.perf-history-pointer.v2"
runner_attempt_receipt = "frankensearch.perf-runner-attempt.v9"
precommit_inventory = "frankensearch.perf-run-precommit.v5"

[evidence]
# Decision-grade artifact layer above the paired estimator (bd-uh2f / bd-uh2f.1).
schema = "quill-perf-evidence-v5"
artifact = "<gate>.evidence.json sealed with an embedded SHA-256 over its own canonical JSON; <gate>.evidence.md derived from the persisted JSON string; atomic tmp+fsync+rename+dirsync writes; load verifies seal, reconstructs the exact profile applicability plan, admits bounded partial runnable selections only as non-adjudicable diagnostics, requires exact Required+Diagnostic coverage with matching roles for ratchet admission, rejects every NotApplicable cell, requires execution_capacity and max_exercised_cell_width to equal that reconstructed plan, recomputes every estimator and registry-bound runner identity from retained raw facts, and rejects truncated or stale-schema files; legacy quill-perf-artifact-v3 thresholds load only via the explicit read-only path"
estimands = "metric-specific, enforced by gate: QG-1/2/3/4/5/8 flat paired log ratio; QG-6 hierarchical two-stage per-query resampling (queries first, then blocks; 16 pinned queries per class); QG-7 process RSS; QG-9 cold open requiring verified cache-state proof (currently NoDecision: in-process reopen does not drop the OS page cache); QG-10 dependency facts outside timing A/A (diagnostic)"
policy = "reconciliation dead band ln(1.005); absolute-vs-paired tolerance ln(1.25); >=2 hierarchical groups with >=2 pairs each; 1 warmup round outside every decision set; raw-sample cap 20000 per cell"
provenance = "benchmark ELF SHA-256; benchmark git revision + dirty-state hash; Cargo.lock SHA-256; exact NUL-separated and NUL-terminated process argv SHA-256; canonical cleared build-plus-workload environment SHA-256; frankensearch.quill-local-perf-producer.v4 identity with build-time full Git revision, dirty posture, Cargo.lock SHA-256, and independently hashed held finalizer executable; benchmark-reported rustc/target/profile/features and host label/fingerprint/load are sealed diagnostic context, not separate receipt-attested facts (the receipt independently binds source, lock, ELF, argv, controlled environment, compatible target OS/architecture, hardware, topology, ISA, affinity, governor, and execution envelope); producer OS; immutable hardware/profile key; registry-derived capacity semantics, execution capacity, and per-gate maximum width; host-wide physical cores and logical threads; process-available concurrency; configured engine widths plus per-cell observed Quill/Tantivy concurrency for QG-1/QG-8; exact runtime-detected ISA joined to the registry v2 hardware class and receipt v6; effective affinity/cpuset cap; peak RSS with method (unsupported reported as absent, never zero); corpus/query-set hashes + generator seed/revision; exact frozen registry and applicability-plan identities; hardware/request/start/end facts; exact v3 run-log/threshold/pre-binding-evidence artifact manifest; sealed post-exit v6 runner-completion receipt bytes and SHA-256"
ratchet_seam = "the shell performs bounded argument/root-shape checks, accepts only the immutable --hardware-class plus --execution-profile key, opens the prebuilt typed finalizer on inherited descriptor 9, and executes that held descriptor; the typed producer opens the canonical shared-namespace host-global lease before Git inspection, hashing, run-directory creation, or local benchmark compilation; registered hosts provide one shared mount namespace and do not unlink/rename the lease inode during a campaign; compiler and benchmark children inherit the locked open-file description so producer death cannot orphan unleased load; under the lease the producer rejects redirecting Git and process-injection state, clears and rebuilds exact Cargo/measurement environments, persists and receipt-binds their canonical environment-policy.json preimage, rejects hidden index flags, dirty source, and noncanonical roots, pins output/target directory handles, verifies the held finalizer against its embedded build identity, creates the run root relative to the pinned parent, constrains the Cargo-reported benchmark beneath the pinned target, and hashes/executes its held descriptor; observed thermal/start facts must pass frozen-registry hardware/execution/durability preflight before the run log opens or the child spawns; on Linux the producer establishes a child-subreaper boundary only with no pre-existing children, adopts and inventories every post-root descendant, and rejects promotion if any descendant escaped direct-child completion; a failed child emits only a sealed nonpromotable frankensearch.perf-runner-attempt.v9 diagnostic receipt; a successful run owns end probes, exact v3 artifact manifest, terminal receipt admission, and an in-memory bound preview, then writes diagnostic-only frankensearch.perf-run-precommit.v5 PRECOMMIT.json, the strict v6 runner receipt, and exact receipt-bound v5 evidence in acyclic seal order; after jointly reloading that pair, it atomically publishes the H2 attempt receipt last as the sole complete-shard commit boundary; receipts retain the family-specific logical lease identity plus the checked lease file device and inode; before baseline resolution, the promotion command opens an exclusive lock on the canonical history directory and holds it through publication; when no profile-qualified latest pointer exists, the baseline must be that gate's exact canonical unmeasured sentinel path inside the locked directory, and once a latest pointer exists the baseline must be that exact canonical v2 pointer path; copied or directly supplied thresholds, stale pointers, and bootstrap replays are rejected before any decision or history write; a measured baseline resolves through one profile-qualified v2 latest pointer to its immutable already-bound threshold-v7/evidence-v5 generation while candidate and rerun supply fresh pre-binding evidence, receipt, manifest, and actual log inputs and must carry byte-equal profile, producer, and benchmark identities; only the exact current-schema unmeasured sentinel may omit baseline evidence and any attempted sentinel identity is rejected as fabrication; invalid, stale, mixed, tampered, unverified, incomplete-runnable, or measured-N/A runs are never ratchet-admissible and perform zero history writes; an Allow decision durably records the complete publication plan before immutable <date>.<run-id> objects are written and the single profile-qualified latest pointer advances last; downstream validators consult ratchet_admissible() and record Allow/Block/Quarantine via apply_gate_decision (bd-quill-e8-perf-doctrine-x4e4.15.1)"

[corpus.tiny]
source = "fsfs benchmark_baseline_matrix golden profile 'tiny'"
[corpus.small]
source = "fsfs benchmark_baseline_matrix golden profile 'small'"
[corpus.medium]
source = "fsfs benchmark_baseline_matrix golden profile 'medium'"
[corpus.xlarge]
source = "synthetic 1M docs; Zipf terms s in {0.8,1.1,1.4}; code-file length distribution capped 2MiB; unicode mix lanes; generator = quill-e6.1 (content-addressed seed manifest embedded in artifacts)"
status = "LANDED deterministic content-addressed 1M-doc generator (quill-e6.1)"

[gate.QG-1]
name = "bulk indexing, multi-core"
fixture = "tiny + small + medium + xlarge; positions ON/OFF; threads = 1,2,4,8,16,32,64,96,128; commit included in timed window"
target = "docs_per_sec >= 3.0x oracle AND >= 0.60x measured tokenize-only bandwidth ceiling (honesty denominator lane: same corpus through the tokenizer alone)"
primary_target_cell_width = 8
activated = false

[gate.QG-2]
name = "bulk indexing, single-thread"
fixture = "medium; positions ON; threads = 1; commit included"
target = "docs_per_sec >= 1.5x oracle"
activated = false

[gate.QG-3]
name = "watch-mode incremental"
fixture = "5k-update upsert-heavy batches over a warm medium corpus; measured in BOTH topologies (bd-quill-duel-visibility-contract): (a) in-process reader, (b) fresh-process reader"
target = "floor: >=20k docs/s initial, >=5k updates/s, p95 <= 25ms (lexical_pipeline.rs contract, both topologies where applicable); headroom: update->searchable >= 4x oracle commit+reload path — claim (a) IN-PROCESS ONLY, publish both numbers with topology labels"
activated = false

[gate.QG-4]
name = "commit latency"
fixture = "100k-doc index, warm; sealed-commit distribution over 100 commits"
target = "p99 <= 50ms sealed commit; visibility lead (in-process searchable-before-commit) demonstrated once delta (e5.x) lands — until then this clause is N/A (G1a has no delta)"
activated = false

[gate.QG-5]
name = "full compaction"
fixture = "50k docs (medium) at tombstone densities {5, 20, 50}% — NEVER 0% (bd-6m8p lesson). Scored on medium, not xlarge, because perf.rs emits `compaction/medium/{density}pct` and perf_ratchet pins that same label: an xlarge-pinned ratchet cell would match no emitted cell, bind nothing, and leave QG-5 scoring nothing while still reading green. The corpus.xlarge e6.1 generator has since LANDED (see [corpus.xlarge].status), so re-pinning is now unblocked; it must be done as one change across perf.rs, perf_ratchet.rs and this fixture line, with a re-baseline. Tracked as the 2026-08-02 harmonization follow-up."
target = "wall-clock >= 5x faster than oracle force-merge at 20%; report all densities"
activated = false

[gate.QG-6]
name = "query latency"
fixture = "query-class mix from search_quality_harness slices (identifier/short_keyword/natural_language/phrase/boolean) x k in {10,100} x corpus {100k, 1M}"
queries_per_class = 16
target = "p50 parity (+-10%) per class; p99 <= oracle per class; NO class regresses >10%; fuel-metering checkpoints (bd-quill-duel-fuel-metering) must show no measurable delta here before merging"
activated = false

[gate.QG-7]
name = "memory"
fixture = "peak ingest RSS at equal budget config (medium, 8 threads); index bytes/doc on medium+xlarge"
target = "peak RSS <= oracle; bytes/doc <= 1.15x oracle (positions ON) and <= 0.8x (positions OFF vs oracle positions-on default); budget DECLARES the 8-bytes/doc IDMAP content_hash (registry 1.0.2) and tombstone/blockmax/idmap overheads itemized"
activated = false

[gate.QG-8]
name = "scaling curve (contention honesty)"
fixture = "bulk indexing threads {1,2,4,8,16,(32 where applicable)} projected through each registered hardware/execution profile's typed applicability plan; oracle curve measured alongside"
target = "16-thread >= 1.8x own 4-thread on x86 reference; any plateau ATTRIBUTED (allocator contention axis mandatory — e8.4 notes; a bandwidth ceiling is honest, a lock plateau is a bug). Apple Silicon QG-8 uses the unchanged canonical literal widths and the typed execution-profile applicability plan: M4 scheduler-10 has capacity 10 but its widest runnable canonical cell is 8, so no width-10 cell or P/E residency claim may be invented; M4 promotion remains unavailable until actual scheduler-state and loaded-image witnesses bind the run and a reviewed profile-aware 8-vs-4 target/evaluator replaces the x86-only 16-thread requirement. M5 scheduler-14 remains unavailable with no capacity or executable cells until a real fingerprint and scheduler receipt land; no M4/x86 substitute or all-N/A release plan may activate an Apple claim"
activated = false

[gate.QG-9]
name = "cold open"
fixture = "1M-doc index (xlarge), cold page cache (documented eviction method per OS); default config (durable verify OFF)"
target = "open() <= 50ms (manifest + lazy sections) vs oracle reader open"
activated = false

[gate.QG-10]
name = "dependency surface"
fixture = "cargo tree -p frankensearch --features lexical, default features, post-flip"
target = "tantivy + its transitive tree ABSENT from default graph; delta recorded in the flip evidence bundle (quill-e7.6)"
activated = false
