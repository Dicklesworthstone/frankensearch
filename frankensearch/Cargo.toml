[package]
name = "frankensearch"
version = "0.3.2"
description = "Two-tier hybrid search for Rust: sub-millisecond initial results, quality-refined rankings in 150ms"
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = ["hash"]
bench-internals = ["frankensearch-core/bench-internals"]
hash = ["frankensearch-embed/hash"]
model2vec = ["frankensearch-embed/model2vec"]
fastembed = ["frankensearch-embed/fastembed"]
lexical = ["dep:frankensearch-lexical"]
lexical-tantivy = ["dep:frankensearch-lexical"]
cass-compat = ["lexical-tantivy"]
quill = ["dep:frankensearch-quill", "frankensearch-fusion/quill"]
graph = ["frankensearch-fusion/graph"]
storage = ["dep:frankensearch-storage"]
durability = [
    "dep:frankensearch-durability",
    "frankensearch-quill?/durability",
]
fts5 = ["storage", "frankensearch-storage/fts5"]
rerank = ["dep:frankensearch-rerank", "frankensearch-rerank/native", "frankensearch-fusion/rerank"]
native = ["dep:frankensearch-rerank", "frankensearch-rerank/native", "frankensearch-fusion/rerank"]
fastembed-reranker = ["rerank", "frankensearch-rerank/fastembed-reranker"]
ann = ["frankensearch-index/ann"]
download = ["frankensearch-embed/download"]
api = ["frankensearch-embed/api"]
semantic = ["hash", "model2vec", "fastembed"]
hybrid = ["semantic", "lexical"]
persistent = ["hybrid", "storage"]
durable = ["persistent", "durability"]
full = ["durable", "rerank", "ann", "download", "graph", "api"]
full-fts5 = ["full", "fts5"]

[dependencies]
frankensearch-core = { workspace = true }
frankensearch-embed = { workspace = true }
frankensearch-index = { workspace = true }
frankensearch-lexical = { workspace = true, optional = true }
frankensearch-quill = { workspace = true, optional = true }
frankensearch-fusion = { workspace = true }
frankensearch-rerank = { workspace = true, optional = true }
frankensearch-storage = { workspace = true, optional = true }
frankensearch-durability = { workspace = true, optional = true }
asupersync = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
tempfile = "3"
frankensearch-core = { workspace = true }
frankensearch-embed = { workspace = true }
frankensearch-index = { workspace = true }
frankensearch-fusion = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
toml = { workspace = true }
# Third-party incumbent arm for benches/fsvi_4bit_vs_incumbent.rs: ndarray's
# f32 dot routes to matrixmultiply's runtime-dispatched AVX2 sgemm/sgemv, which
# is the kernel shape faiss `IndexFlatIP` uses for exact search. Kept in
# dev-dependencies so no incumbent code enters the shipped crate.
ndarray = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
# Lets a test claim `tracing`'s global default subscriber before
# `asupersync::test_utils::run_test_with_cx` installs its own TRACE-level one.
# Without this the HuggingFace tokenizer logs five lines per character and a
# single embedding lane burns >10 CPU-hours. See bd-irb1.
tracing-subscriber = { workspace = true }

[[bench]]
name = "search_bench"
harness = false
required-features = ["lexical-tantivy"]

[[bench]]
name = "fsvi_4bit_vs_incumbent"
harness = false

[[bench]]
name = "index_builder_lexical_staging"
harness = false
required-features = ["lexical", "bench-internals"]

[lints]
workspace = true
